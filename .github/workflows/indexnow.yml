# Signale les pages du site à IndexNow (Bing, Yandex, Seznam…) après chaque mise en ligne.
# Remplace l'appel depuis la tâche quotidienne, dont l'environnement ne peut pas joindre api.indexnow.org.
name: indexnow
on:
  push:
    branches: [main]
    paths: ["content/**", "sitemap.xml", "scripts/guides.mjs"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Laisse à Vercel le temps de mettre la nouvelle version en ligne.
      - run: sleep 240
      - run: npm run indexnow
