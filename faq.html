  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Qu'est-ce que VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR est un copilote financier intelligent pour dirigeants, DAF et experts-comptables. Il transforme vos chiffres en pilotage clair : reporting automatisé, prévisions de trésorerie et alertes triées par impact en euros, le tout résumé dans un Vyzor Score lisible en quelques secondes."}},{"@type":"Question","name":"À qui s'adresse VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"Avant tout aux experts-comptables qui veulent offrir à leurs clients un véritable pilotage financier et se positionner en conseil à forte valeur ajoutée. VYZOR s'adresse aussi aux dirigeants de PME qui veulent piloter sans être experts-comptables, et aux DAF — internes, externalisés ou à temps partagé — qui veulent gagner du temps sur le reporting. L'outil est d'ailleurs co-conçu avec un panel de professionnels du chiffre qui l'utilisent au quotidien."}},{"@type":"Question","name":"Faut-il être expert en finance pour utiliser VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"Non. VYZOR est pensé pour être lisible en quelques secondes, même sans bagage financier : un score de santé synthétique, des alertes hiérarchisées par impact en euros et un export PDF prêt pour le conseil d'administration."}},{"@type":"Question","name":"Comment VYZOR se connecte-t-il à ma comptabilité ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR importe directement votre FEC (Fichier des Écritures Comptables) — sans aucune re-saisie — et peut aussi se connecter via API à vos outils comptables. Vos données sont structurées automatiquement pour produire reporting, prévisions et alertes."}},{"@type":"Question","name":"Quels logiciels comptables se connectent à VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR se connecte en lecture seule à Pennylane, MyUnisoft et Odoo. Les connexions bancaires et l'agrégateur Chift sont en préparation. Et si votre outil n'est pas encore couvert, l'import de fichiers (FEC, Excel, PDF de liasse fiscale) prend le relais."}},{"@type":"Question","name":"Quels fichiers puis-je importer si je n'ai pas de connecteur ?","acceptedAnswer":{"@type":"Answer","text":"Vous pouvez importer votre FEC, des fichiers Excel (.xlsx ou .csv) ou un PDF de liasse fiscale, directement depuis votre espace Documents. VYZOR les structure automatiquement pour calculer vos indicateurs, même sans connecteur."}},{"@type":"Question","name":"VYZOR modifie-t-il ma comptabilité ?","acceptedAnswer":{"@type":"Answer","text":"Non, jamais. VYZOR accède à vos données en lecture seule : il les lit pour les analyser, mais n'écrit, ne modifie ni ne supprime rien dans votre comptabilité."}},{"@type":"Question","name":"À quelle fréquence mes données sont-elles mises à jour ?","acceptedAnswer":{"@type":"Answer","text":"Vous synchronisez vos données d'un simple clic, quand vous le souhaitez. Une synchronisation automatique quotidienne est prévue prochainement."}},{"@type":"Question","name":"Combien de temps pour être opérationnel après connexion ?","acceptedAnswer":{"@type":"Answer","text":"Quelques minutes suffisent. Dès la première synchronisation, vos indicateurs et votre Vyzor Score sont calculés et prêts à être pilotés."}},{"@type":"Question","name":"Comment déconnecter ou révoquer l'accès à mes données ?","acceptedAnswer":{"@type":"Answer","text":"À tout moment. Un bouton « Déconnecter » dans votre espace Documents (ou la révocation depuis votre logiciel comptable) coupe l'accès immédiatement. L'historique déjà calculé reste à votre disposition."}},{"@type":"Question","name":"Quels indicateurs VYZOR calcule-t-il ?","acceptedAnswer":{"@type":"Answer","text":"Plus de 35 indicateurs clés : chiffre d'affaires, EBE / EBITDA, BFR, DSO / DPO, trésorerie, ROE, ROCE, solvabilité… le tout synthétisé dans un Vyzor Score de 0 à 100 pour une lecture immédiate de votre santé financière."}},{"@type":"Question","name":"C'est quoi le Vyzor Score ?","acceptedAnswer":{"@type":"Answer","text":"C'est une note de santé financière composite, de 0 à 100, qui agrège quatre dimensions : rentabilité, solvabilité, liquidité et efficacité. Un repère unique pour situer l'entreprise en un coup d'œil et suivre sa progression dans le temps."}},{"@type":"Question","name":"VYZOR me prévient-il en cas de problème ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR génère des alertes fondées sur des règles métier précises — sans approximation — et les trie par impact en euros, pour que vous traitiez d'abord ce qui pèse vraiment sur vos résultats."}},{"@type":"Question","name":"VYZOR fait-il des prévisions de trésorerie (cash runway) ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR projette votre trésorerie, estime votre rythme de consommation (burn rate) et calcule votre autonomie financière (runway) en nombre de mois."}},{"@type":"Question","name":"Puis-je comparer mes chiffres à ceux de mon secteur ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR situe vos indicateurs face à des benchmarks sectoriels issus des données publiques de l'INSEE (ESANE), pour savoir où vous vous positionnez par rapport à votre secteur."}},{"@type":"Question","name":"VYZOR compare-t-il mon réalisé à un budget prévisionnel ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Vous importez votre budget prévisionnel (fichier Excel, par exercice) et VYZOR compare le réel au budget poste par poste, avec les mêmes formules de KPI. Sur les écrans d'indicateurs et la synthèse, un simple interrupteur permet de basculer la référence de comparaison entre N-1 et votre budget."}},{"@type":"Question","name":"Que peut faire l'assistant IA exactement ?","acceptedAnswer":{"@type":"Answer","text":"L'assistant répond à vos questions sur vos KPI, votre trésorerie et votre fiscalité (TVA, IS). Pour les sujets complexes, il réunit un « Conseil » de plusieurs expertises — analyste, trésorier, juriste et stratège — qui croisent leurs regards sur votre situation."}},{"@type":"Question","name":"Je gère un cabinet : puis-je suivre tous mes dossiers clients ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR offre une vue portefeuille multi-dossiers, avec l'état de synchronisation de chaque client visible en un coup d'œil, et sans limite de nombre de dossiers."}},{"@type":"Question","name":"Mes clients voient-ils ce que je fais dans VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"Non. Les comptes cabinet et les comptes dirigeant sont indépendants et cloisonnés : votre travail d'analyse côté cabinet n'est pas visible par vos clients."}},{"@type":"Question","name":"Puis-je inviter mes collaborateurs sur le compte cabinet ?","acceptedAnswer":{"@type":"Answer","text":"Pas encore : la collaboration à plusieurs au sein d'un même cabinet est prévue pour le 3e trimestre 2026. En attendant, un cabinet pilote l'ensemble de ses dossiers depuis un compte unique."}},{"@type":"Question","name":"Puis-je envoyer un compte-rendu financier par email ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Depuis n'importe quel dashboard, VYZOR rédige pour vous, grâce à l'IA, un compte-rendu basé sur les indicateurs affichés. Vous le relisez, ajustez le ton (professionnel, chaleureux ou concis), puis l'envoyez depuis votre propre messagerie Gmail, avec le rapport PDF en pièce jointe. L'email apparaît dans vos « Envoyés », et la connexion reste révocable à tout moment."}},{"@type":"Question","name":"Faut-il connecter Gmail pour envoyer mes rapports ?","acceptedAnswer":{"@type":"Answer","text":"Oui, pour envoyer vos rapports directement depuis votre propre messagerie. La connexion se fait en un clic et reste révocable à tout moment ; vos emails partent de votre adresse et apparaissent dans vos « Envoyés »."}},{"@type":"Question","name":"Mes données financières sont-elles en sécurité ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Vos données sont chiffrées et hébergées sur une infrastructure conforme SOC 2 et ISO 27001. Le détail de nos engagements de sécurité et de confidentialité est disponible sur notre page Sécurité."}},{"@type":"Question","name":"Où sont hébergées mes données ?","acceptedAnswer":{"@type":"Answer","text":"Vos données sont hébergées dans l'Union européenne, sur une infrastructure cloud conforme aux standards SOC 2 et ISO 27001."}},{"@type":"Question","name":"Mes données nourrissent-elles l'IA ou sont-elles partagées ?","acceptedAnswer":{"@type":"Answer","text":"Non. Vos données ne servent jamais à entraîner des modèles et ne sont pas partagées avec des tiers. Elles restent strictement rattachées à votre compte, et les noms sont pseudonymisés avant toute génération de contenu par l'IA."}},{"@type":"Question","name":"L'IA a-t-elle accès à toute ma comptabilité ?","acceptedAnswer":{"@type":"Answer","text":"Non. L'assistant ne voit que les agrégats du dossier que vous consultez — jamais les écritures comptables brutes, ni les données d'un autre dossier."}},{"@type":"Question","name":"Comment accéder à VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR est actuellement en accès anticipé (bêta), façonné avec ses premiers utilisateurs. Vous pouvez demander votre accès directement depuis le formulaire en bas de page."}},{"@type":"Question","name":"VYZOR est-il en bêta ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR est en accès anticipé, en co-construction avec ses premiers utilisateurs : vous profitez des dernières fonctionnalités et votre retour façonne directement le produit."}}]}</script>

  <script type="text/babel">
    const App = () => {
      const gold = "#f0c949";

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>

          <div style={{
            background: "#070a14",

              </p>
            </header>

            <div className="vz-page-pad" style={{
              maxWidth: 1180,

              padding: "0 clamp(24px, 6vw, 96px)",
            }}>
              <div className="vz-reveal"><VyzorFAQ showHeader={false} /></div>
              <div className="vz-reveal"><BetaFormGlass /></div>
            </div>

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>
        </React.Fragment>
      );
    };
