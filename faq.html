  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Qu'est-ce que VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR est un copilote financier pour dirigeants, DAF et experts-comptables. Il transforme vos données comptables en pilotage clair : reporting automatisé, prévisions de trésorerie et alertes triées par impact en euros, le tout résumé dans un Vyzor Score lisible en quelques secondes."}},{"@type":"Question","name":"À qui s'adresse VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"Avant tout aux dirigeants de PME qui utilisent Pennylane et veulent piloter sans être financiers. Vyzor sert aussi les DAF — internes, externalisés ou à temps partagé — qui veulent gagner du temps sur le reporting, et les experts-comptables qui veulent offrir un vrai pilotage financier à leurs clients."}},{"@type":"Question","name":"Faut-il être expert en finance pour l'utiliser ?","acceptedAnswer":{"@type":"Answer","text":"Non. Le Vyzor Score résume la santé financière de l'entreprise en une note sur 100, les alertes sont classées par impact en euros pour savoir quoi traiter en premier, et l'assistant IA répond à vos questions en langage courant."}},{"@type":"Question","name":"VYZOR remplace-t-il mon expert-comptable ?","acceptedAnswer":{"@type":"Answer","text":"Non. VYZOR ne tient pas votre comptabilité : il s'appuie sur celle produite par votre cabinet pour la transformer en outil de pilotage. Il est d'ailleurs co-conçu avec des professionnels du chiffre pour enrichir la relation de conseil entre le cabinet et ses clients."}},{"@type":"Question","name":"Comment accéder à VYZOR ?","acceptedAnswer":{"@type":"Answer","text":"VYZOR est en accès anticipé (bêta), co-construit avec ses premiers utilisateurs : vous profitez des nouveautés en avant-première et vos retours orientent directement le produit. Demandez votre accès via le formulaire en bas de page."}},{"@type":"Question","name":"Comment VYZOR récupère-t-il mes données comptables ?","acceptedAnswer":{"@type":"Answer","text":"Deux options, sans aucune re-saisie. Par connecteur, en lecture seule, avec Pennylane (MyUnisoft et Odoo en cours de finalisation). Ou par import de fichiers depuis votre espace Documents : FEC, Excel (.xlsx, .csv) ou PDF de liasse fiscale. Les données sont ensuite structurées automatiquement."}},{"@type":"Question","name":"Mon logiciel comptable n'a pas de connecteur, que faire ?","acceptedAnswer":{"@type":"Answer","text":"L'import de fichiers prend le relais : tous les logiciels comptables utilisés en France savent exporter un FEC, format légal obligatoire. Les connexions bancaires sont en préparation."}},{"@type":"Question","name":"Combien de temps pour être opérationnel ?","acceptedAnswer":{"@type":"Answer","text":"Quelques minutes. Dès la première synchronisation, vos indicateurs et votre Vyzor Score sont calculés et prêts à être pilotés."}},{"@type":"Question","name":"À quelle fréquence mes données sont-elles mises à jour ?","acceptedAnswer":{"@type":"Answer","text":"Vous synchronisez vos données d'un clic, quand vous le souhaitez. Une synchronisation automatique quotidienne arrive prochainement."}},{"@type":"Question","name":"Quels indicateurs VYZOR calcule-t-il ?","acceptedAnswer":{"@type":"Answer","text":"Plus de 35 indicateurs clés : chiffre d'affaires, EBE / EBITDA, BFR, DSO / DPO, trésorerie, ROE, ROCE, solvabilité… Tous sont synthétisés dans le Vyzor Score."}},{"@type":"Question","name":"Comment est calculé le Vyzor Score ?","acceptedAnswer":{"@type":"Answer","text":"C'est une note composite de 0 à 100 qui agrège quatre dimensions : rentabilité, solvabilité, liquidité et efficacité. Un repère unique pour situer l'entreprise en un coup d'œil et suivre sa progression dans le temps."}},{"@type":"Question","name":"Comment fonctionnent les alertes ?","acceptedAnswer":{"@type":"Answer","text":"Elles reposent sur des règles métier précises, sans approximation, et sont triées par impact en euros : vous traitez d'abord ce qui pèse vraiment sur vos résultats."}},{"@type":"Question","name":"VYZOR fait-il des prévisions de trésorerie ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR projette votre trésorerie, estime votre rythme de consommation (burn rate) et calcule votre autonomie financière (runway) en nombre de mois."}},{"@type":"Question","name":"Puis-je comparer mon réalisé à mon budget ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Importez votre budget prévisionnel (Excel, par exercice) : VYZOR compare le réel au budget poste par poste, avec les mêmes formules de KPI. Un interrupteur permet de basculer la référence entre N-1 et le budget."}},{"@type":"Question","name":"Puis-je me comparer aux entreprises de mon secteur ?","acceptedAnswer":{"@type":"Answer","text":"Oui. VYZOR situe vos indicateurs face à des benchmarks sectoriels issus des données publiques de l'INSEE (ESANE)."}},{"@type":"Question","name":"Que peut faire l'assistant IA ?","acceptedAnswer":{"@type":"Answer","text":"Il répond à vos questions sur vos KPI, votre trésorerie et votre fiscalité (TVA, IS). Pour les sujets complexes, il réunit un « Conseil » de plusieurs expertises — analyste, trésorier, juriste et stratège — qui croisent leurs regards sur votre situation."}},{"@type":"Question","name":"Puis-je envoyer un compte-rendu financier par email ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Depuis n'importe quel dashboard, l'IA rédige un compte-rendu basé sur les indicateurs affichés. Vous le relisez, ajustez le ton (professionnel, chaleureux ou concis) et l'envoyez depuis votre propre adresse Gmail, rapport PDF en pièce jointe. La connexion Gmail se fait en un clic et reste révocable à tout moment."}},{"@type":"Question","name":"Puis-je suivre tous mes dossiers clients au même endroit ?","acceptedAnswer":{"@type":"Answer","text":"Oui. La vue portefeuille affiche tous vos dossiers, avec l'état de synchronisation de chacun visible en un coup d'œil, sans limite de nombre."}},{"@type":"Question","name":"Mes clients voient-ils mon travail d'analyse ?","acceptedAnswer":{"@type":"Answer","text":"Non. Les comptes cabinet et les comptes dirigeant sont indépendants et cloisonnés : votre travail côté cabinet n'est pas visible par vos clients."}},{"@type":"Question","name":"Où et comment mes données sont-elles protégées ?","acceptedAnswer":{"@type":"Answer","text":"Elles sont chiffrées et hébergées dans l'Union européenne, sur une infrastructure conforme SOC 2 et ISO 27001."}},{"@type":"Question","name":"VYZOR peut-il modifier ma comptabilité ?","acceptedAnswer":{"@type":"Answer","text":"Non, jamais. VYZOR accède à vos données en lecture seule : il les analyse, mais n'écrit, ne modifie ni ne supprime rien."}},{"@type":"Question","name":"Mes données servent-elles à entraîner l'IA ?","acceptedAnswer":{"@type":"Answer","text":"Non. Vos données ne servent jamais à entraîner des modèles et ne sont partagées avec aucun tiers. Les noms sont pseudonymisés avant toute génération de contenu par l'IA."}},{"@type":"Question","name":"Que voit l'assistant IA de ma comptabilité ?","acceptedAnswer":{"@type":"Answer","text":"Uniquement les agrégats du dossier que vous consultez — jamais les écritures comptables brutes, ni les données d'un autre dossier."}},{"@type":"Question","name":"Comment révoquer l'accès à mes données ?","acceptedAnswer":{"@type":"Answer","text":"À tout moment : le bouton « Déconnecter » de votre espace Documents, ou la révocation depuis votre logiciel comptable, coupe l'accès immédiatement. L'historique déjà calculé reste disponible."}}]}</script>

  <script type="text/babel">
    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>

          <div style={{
            background: "#0a1026",
            backgroundImage: "none",

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>

      );
    };
