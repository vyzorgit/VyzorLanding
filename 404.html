<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Page introuvable — VYZOR</title>
  <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retrouvez VYZOR, le copilote financier des dirigeants." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- Servie par Vercel pour toute adresse inconnue, à n'importe quelle profondeur : chemins absolus. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/vyzor-mark.svg" />
  <meta name="theme-color" content="#0f1530" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #f0c949;
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --line: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #070a14; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      padding: 48px 16px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background-image: radial-gradient(ellipse 60% 45% at 50% 0%, rgba(240,201,73,0.10), transparent 70%);
    }
    main { width: 100%; max-width: 640px; text-align: center; }
    .mark { width: 48px; height: 48px; margin: 0 auto 32px; display: block; }
    .code { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: var(--gold); }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 48px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; text-wrap: balance; }
    p.lede { margin: 0 auto 36px; max-width: 480px; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 48px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px;
      font-size: 15px; font-weight: 600; text-decoration: none;
      transition: transform 200ms cubic-bezier(0.22,1,0.36,1), background-color 200ms, border-color 200ms;
    }
    .btn-primary { background: var(--gold); color: #0a0a0a; }
    .btn-primary:hover { background: #f4d468; }
    .btn-ghost { border: 1px solid rgba(255,255,255,0.22); color: #fff; }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.45); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible, .links a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .links { border-top: 1px solid var(--line); padding-top: 28px; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: center; font-size: 14px; }
    .links a { color: var(--muted); text-decoration: none; }
    .links a:hover { color: #fff; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/vyzor-mark.svg" alt="VYZOR" width="48" height="48" />
    <p class="code">ERREUR 404</p>
    <h1>Cette page n'existe pas</h1>
    <p class="lede">L'adresse est peut-être mal saisie, ou la page a été déplacée. Tout le reste de VYZOR est toujours là.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour à l'accueil <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="/?contact=1">Rejoindre la bêta</a>
    </div>
    <nav class="links" aria-label="Pages utiles">
      <a href="/fonctionnalites.html">Fonctionnalités</a>
      <a href="/calculateurs.html">Calculateurs gratuits</a>
      <a href="/securite.html">Sécurité</a>
      <a href="/faq.html">FAQ</a>
    </nav>
  </main>
</body>
</html>
