<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyzor — Vision Agentic Twin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1A2E'/%3E%3Cpath d='M18 18 L32 47 L46 18' fill='none' stroke='%23f0c949' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a14; --surface:#0e0e11; --card:#1A1A2E;
  --gold:#f0c949; --gold-soft:rgba(240,201,73,.12);
  --txt:#FFFFFF; --txt2:#9CA3AF; --txt3:#6B7280;
  --line:rgba(255,255,255,.08);
  --ok:#22C55E; --bad:#EF4444; --warn:#F59E0B;
  --glass:rgba(15,15,18,.85);
  --r:16px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(58% 36% at 50% -2%, rgba(240,201,73,.085), transparent 70%),
    var(--bg);
  color:var(--txt);
  font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(240,201,73,.32)}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{max-width:960px;margin:0 auto;padding:22px 24px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--card);border:1px solid rgba(240,201,73,.35);display:grid;place-items:center;box-shadow:0 0 24px rgba(240,201,73,.10)}
.brand .word{font-weight:800;font-size:13px;letter-spacing:.24em}
.tright{display:flex;align-items:center;gap:8px}
.pill{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.replay{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--txt2);background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:999px;padding:7px 13px;transition:all .25s}
.replay:hover{color:var(--gold);border-color:rgba(240,201,73,.5);box-shadow:0 0 18px rgba(240,201,73,.10)}

/* ---------- Stage ---------- */
.stage{max-width:920px;margin:0 auto;padding:6px 24px 40px}
.ctx{display:flex;align-items:center;gap:9px;margin:8px 0 18px;font-size:12px;color:var(--txt3);letter-spacing:.01em}
.ctx .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

#greet{max-height:130px;overflow:hidden;transition:max-height .6s var(--ease),opacity .5s,margin .5s}
#greet.gone{max-height:0;opacity:0;margin:0}
.greet{font-size:27px;font-weight:300;letter-spacing:-.01em;margin-bottom:5px}
.greet-sub{color:var(--txt2);font-size:14.5px;margin-bottom:24px}

/* ---------- Champ de question (héros) ---------- */
.ask{position:relative;display:flex;align-items:center;gap:13px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:17px 18px;overflow:hidden;box-shadow:0 0 24px rgba(240,201,73,.06);transition:border-color .35s,box-shadow .35s}
.ask:focus-within{border-color:rgba(240,201,73,.45);box-shadow:0 0 0 1px rgba(240,201,73,.22),0 0 36px rgba(240,201,73,.10)}
.ask .aicon{color:var(--gold);display:grid;place-items:center;flex:0 0 auto;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 19px/1.4 'Hanken Grotesk',sans-serif;caret-color:var(--gold)}
.ask input::placeholder{color:var(--txt3)}
.sendbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt2);transition:all .25s;flex:0 0 auto}
.sendbtn:hover{color:var(--gold);border-color:rgba(240,201,73,.5)}
.beam{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:200% 100%;opacity:0;transition:opacity .4s}
.ask.busy .beam{opacity:.9;animation:beam 1.5s linear infinite}
@keyframes beam{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Équipe d'agents ---------- */
.agents{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.agent{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;background:rgba(255,255,255,.02);transition:all .4s var(--ease);opacity:.5;flex:0 0 auto}
.agent .ic{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--txt2);transition:all .35s;flex:0 0 auto}
.agent .tx{display:flex;flex-direction:column}
.agent .nm{font-size:12.5px;font-weight:600;color:var(--txt2);white-space:nowrap;transition:color .3s}
.agent .st{font-size:11px;color:var(--txt3);white-space:nowrap;height:0;opacity:0;overflow:hidden;transition:height .3s var(--ease),opacity .3s}
.agent.lead{opacity:.8}
.agent.lead .ic{color:var(--gold)}
.agent.active{opacity:1;border-color:rgba(240,201,73,.5);background:rgba(240,201,73,.06);box-shadow:0 0 20px rgba(240,201,73,.12)}
.agent.active .ic{background:var(--gold-soft);color:var(--gold);animation:agpulse 1.7s ease-in-out infinite}
.agent.active .nm{color:#fff}
.agent.active .st,.agent.done .st{height:15px;opacity:1}
.agent.done{opacity:.92;border-color:rgba(34,197,94,.3)}
.agent.done .ic{background:rgba(34,197,94,.09);color:var(--ok);animation:none}
.agent.done .nm{color:#fff}
.agent.done .st{color:rgba(34,197,94,.85)}
@keyframes agpulse{0%,100%{box-shadow:0 0 0 0 rgba(240,201,73,.35)}55%{box-shadow:0 0 0 6px rgba(240,201,73,0)}}
.routing{font-size:12px;color:var(--txt3);letter-spacing:.01em;margin-top:11px;min-height:15px}

/* ---------- Question posée ---------- */
.asked{margin:26px 0 14px;display:flex;gap:11px;align-items:flex-start;opacity:0;transform:translateY(6px);transition:all .45s var(--ease)}
.asked.in{opacity:1;transform:none}
.asked .qic{color:var(--gold);margin-top:2px;flex:0 0 auto}
.asked .q{font-size:15.5px;font-weight:500;color:var(--txt2)}

/* ---------- Canvas de blocs ---------- */
.canvas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.block{grid-column:span 1;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;opacity:0;transform:translateY(16px) scale(.99);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.block.in{opacity:1;transform:none}
.block.span2{grid-column:1 / -1}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.btag{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.bsep{color:var(--txt3);font-size:10px}
.bagent{font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--txt3)}
.mla{margin-left:auto}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.src{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--txt3)}
.verif{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ok)}

/* Simulation */
.srow{margin-bottom:15px}
.srow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--txt2);margin-bottom:7px}
.delta{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--gold)}
.delta.warn{color:var(--warn)}
.delta.bad{color:var(--bad)}
.brow{display:grid;grid-template-columns:84px 1fr 60px;gap:10px;align-items:center;margin-bottom:6px}
.brow .k{font-size:10.5px;color:var(--txt3)}
.brow .v{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.brow .v.gold{color:var(--gold)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s var(--ease)}
.bar.gray i{background:rgba(255,255,255,.24)}
.bar.gold i{background:linear-gradient(90deg,#a8854a,var(--gold))}
.bar.red i{background:linear-gradient(90deg,rgba(239,68,68,.45),rgba(239,68,68,.85))}
.hint{font-size:11px;color:var(--txt3);margin-top:2px}
.inote{display:flex;gap:9px;align-items:flex-start;background:rgba(240,201,73,.07);border:1px solid rgba(240,201,73,.22);border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.5;color:var(--txt2);margin-top:12px}
.inote svg{flex:0 0 auto;margin-top:2px;color:var(--gold)}
.inote b{color:var(--gold);font-weight:700}
.inote.ok{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.25)}
.inote.ok svg{color:var(--ok)}
.inote.ok b{color:var(--ok)}

/* Graphique trésorerie */
.legend{display:flex;gap:14px;align-items:center}
.li{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--txt3);white-space:nowrap}
.lg{width:16px;height:0;border-top:2px solid var(--gold);border-radius:2px;display:inline-block}
.lg.d{border-top:2px dashed rgba(255,255,255,.35)}
.tchart .axis{stroke:rgba(255,255,255,.07)}
.tchart .zline{stroke:rgba(239,68,68,.35);stroke-dasharray:3 5}
.tchart .ylab,.tchart .mlab{fill:#6B7280;font:500 9px 'IBM Plex Mono',monospace}
.tchart .cgold{stroke:var(--gold);stroke-width:2.2;fill:none;filter:drop-shadow(0 0 6px rgba(240,201,73,.35))}
.tchart .cgray{stroke:rgba(255,255,255,.3);stroke-width:1.5;fill:none;stroke-dasharray:5 6}
.tchart .area{fill:url(#gf);opacity:0;transition:opacity .9s}
.tchart .area.in{opacity:.16}
.lowg{opacity:0;transition:opacity .6s}
.lowg.in{opacity:1}
.lowg .dot{fill:var(--gold);stroke:#0b0b0e;stroke-width:1.5}
.lowg .halo{fill:var(--gold);opacity:0;transform-box:fill-box;transform-origin:center}
.lowg.in .halo{animation:halo 2.3s ease-out infinite}
@keyframes halo{0%{transform:scale(.4);opacity:.4}80%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
.lowg .lmain{fill:var(--gold);font:700 12.5px 'Hanken Grotesk',sans-serif}
.lowg .lsub{fill:#9CA3AF;font:500 8.5px 'IBM Plex Mono',monospace}
.lowg .lbad{fill:rgba(239,68,68,.9);font:500 8.5px 'IBM Plex Mono',monospace}

/* Synthèse */
.answer{font-size:18px;line-height:1.65;color:#E9E9EE;max-width:64ch}
.answer .w{opacity:0;transition:opacity .35s}
.answer .w.in{opacity:1}
.answer .w.b{color:var(--gold);font-weight:700}
.audit{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(240,201,73,.4);background:rgba(240,201,73,.06);color:var(--gold);border-radius:999px;padding:5px 12px;font-size:10.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.rline{font-size:11px;color:var(--txt3);margin-top:12px}

/* Relances clients */
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.crow:last-of-type{border-bottom:0}
.crow .cl .nm{font-size:13.5px;font-weight:600}
.crow .cl .sub{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3);margin-top:2px}
.rdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.rdot.w{background:var(--warn)}
.crow .amt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ctotal{display:flex;justify-content:space-between;align-items:center;padding-top:11px;margin-top:3px;border-top:1px solid rgba(255,255,255,.08)}
.ctotal .k{font-size:12px;color:var(--txt2);font-weight:600}
.ctotal .amt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--gold)}

/* Tuiles TVA */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:2px}
.tile{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:rgba(255,255,255,.02)}
.tile .k{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);margin-bottom:7px}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tile.gold{border-color:rgba(240,201,73,.35);background:rgba(240,201,73,.05)}
.tile.gold .v{color:var(--gold)}
.tile .tsub{display:block;font-size:10.5px;color:var(--txt3);margin-top:4px}

/* Marge */
.mhead{display:flex;align-items:baseline;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.mhead .lbl{font-size:12.5px;color:var(--txt2)}
.mhead .from{font-size:19px;font-weight:600;color:var(--txt3)}
.mhead .arr{color:var(--txt3)}
.mhead .to{font-size:19px;font-weight:700;color:#fff}

/* Action card */
.block.action{border-color:rgba(240,201,73,.35);box-shadow:0 0 30px rgba(240,201,73,.07);display:flex;align-items:center;gap:18px;position:relative}
.atag{display:block;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.9;margin-bottom:5px}
.aic{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold);flex:0 0 auto}
.acontent{flex:1;min-width:0}
.atitle{font-size:14.5px;font-weight:700}
.adesc{font-size:12.5px;color:var(--txt2);margin-top:3px;line-height:1.5}
.aafter{display:none;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);margin-top:7px}
.aafter.show{display:flex}
.abtns{display:flex;gap:8px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:10px 16px;font-size:13px;font-weight:600;transition:all .25s;border:1px solid transparent}
.btn.gold{background:var(--gold);color:#0d0d10;font-weight:700}
.btn.gold:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(240,201,73,.3)}
.btn.gold:disabled{transform:none;cursor:default}
.btn.gold.okd{background:rgba(34,197,94,.14);color:var(--ok);border-color:rgba(34,197,94,.4);box-shadow:none}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--txt2)}
.btn.ghost:hover{color:#fff;border-color:rgba(255,255,255,.2)}

/* Chips d'exploration */
.chips{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;opacity:0;transform:translateY(8px);transition:all .5s var(--ease);pointer-events:none}
.chips.in{opacity:1;transform:none;pointer-events:auto}
.chiplabel{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--txt2);border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:500;transition:all .25s}
.chip svg{color:var(--gold);opacity:.7}
.chip:hover{border-color:rgba(240,201,73,.5);color:#fff;background:rgba(240,201,73,.05);box-shadow:0 0 18px rgba(240,201,73,.08)}

/* Toast proactif */
.toast{position:relative;margin:20px 0 2px;max-width:440px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:14px;padding:15px 16px;box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 30px rgba(240,201,73,.06);opacity:0;transform:translateY(18px);transition:all .5s var(--ease);pointer-events:none}
.toast.in{opacity:1;transform:none;pointer-events:auto}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.thead .tic{color:var(--gold);display:grid;place-items:center}
.thead .tt{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tclose{margin-left:auto;background:none;border:0;color:var(--txt3);display:grid;place-items:center;padding:2px}
.tclose:hover{color:#fff}
.tbody{font-size:13px;line-height:1.55;color:var(--txt2)}
.tbody b{color:#fff}
.tbtns{display:flex;gap:8px;margin-top:11px}
.tbtn{border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;border:1px solid transparent;transition:all .25s}
.tbtn.gold{background:var(--gold);color:#0d0d10;font-weight:700}
.tbtn.gold:hover{box-shadow:0 4px 16px rgba(240,201,73,.3)}
.tbtn.ghost{background:transparent;border-color:var(--line);color:var(--txt3)}
.tbtn.ghost:hover{color:#fff}

/* Footer */
.foot{max-width:920px;margin:26px auto 36px;padding:0 24px;display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center}
.sig{font-size:13.5px;color:var(--txt2)}
.sig b{color:var(--gold);font-weight:700}
.legal{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;color:var(--txt3)}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  .stage{padding:6px 16px 32px}
  .topbar{padding:18px 16px 8px}
  .pill{display:none}
  .canvas{grid-template-columns:1fr}
  .agents{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .agents::-webkit-scrollbar{display:none}
  .ask input{font-size:17px}
  .greet{font-size:23px}
  .answer{font-size:16px}
  .tiles{grid-template-columns:1fr}
  .block.action{flex-direction:column;align-items:stretch;gap:13px}
  .abtns{width:100%}
  .abtns .btn{flex:1;justify-content:center}
  .toast{max-width:none}
  .brow{grid-template-columns:70px 1fr 56px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
/* ============================================================
   Vyzor — Vision Agentic Twin · mock interactif (vanilla JS)
   ============================================================ */

const $ = s => document.querySelector(s);
const canvas = $('#canvas'), input = $('#askInput'), ask = $('#askWrap');
const asked = $('#asked'), routing = $('#routing'), chips = $('#chips');
const toast = $('#toast'), greet = $('#greet');

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SP = RM ? 0.15 : 1;
let timers = [];
const after = (ms, fn) => { const id = setTimeout(fn, ms * SP); timers.push(id); return id; };
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* ---------- Icônes (SVG inline, style Lucide) ---------- */
const I = {
  compass: `<circle cx="12" cy="12" r="9"/><path d="M15.4 8.6 13 13l-4.4 2.4L11 11z"/>`,
  chart: `<path d="M4 5v14h16"/><path d="M7.5 14.5 11 10l3 2.5 4.5-6"/>`,
  wallet: `<rect x="3.5" y="6.5" width="17" height="12" rx="3"/><path d="M3.5 10h17"/><path d="M16.5 14.5h.01"/>`,
  percent: `<path d="M18 6 6 18"/><circle cx="8.2" cy="8.2" r="2.1"/><circle cx="15.8" cy="15.8" r="2.1"/>`,
  shield: `<path d="M12 3.4 19 6v5.1c0 4.4-2.9 7.4-7 9.1-4.1-1.7-7-4.7-7-9.1V6z"/>`,
  clipboard: `<rect x="6" y="4.8" width="12" height="15.4" rx="2.5"/><path d="M9.3 4.8a2.7 2.7 0 0 1 5.4 0"/><path d="M9 11h6M9 14.8h4"/>`,
  check: `<path d="M5 12.5l4.6 4.6L19 7.4"/>`,
  shieldcheck: `<path d="M12 3.4 19 6v5.1c0 4.4-2.9 7.4-7 9.1-4.1-1.7-7-4.7-7-9.1V6z"/><path d="M9.1 12.1l2.1 2.1 3.7-4.2"/>`,
  rotate: `<path d="M3.8 12a8.2 8.2 0 1 0 2.4-5.8"/><path d="M3.8 4.6v4.2H8"/>`,
  spark: `<path d="M12 4.5 13.6 9l4.4 1.5-4.4 1.5L12 16.5 10.4 12 6 10.5 10.4 9z"/><path d="M18.6 15.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/>`,

  file: `<path d="M13.8 3.5H7.7A1.7 1.7 0 0 0 6 5.2v13.6a1.7 1.7 0 0 0 1.7 1.7h8.6a1.7 1.7 0 0 0 1.7-1.7V7.7z"/><path d="M13.8 3.5v4.2H18"/><path d="M9.4 12.6h5.2M9.4 16h5.2"/>`,
  cal: `<rect x="4.5" y="6" width="15" height="14" rx="2.5"/><path d="M4.5 10.5h15M8.3 4v3.6M15.7 4v3.6"/>`,

  x: `<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>`

const icon = (n, s = 16, w = 1.8) =>

$('#askIcon').innerHTML = icon('spark', 19);

/* ---------- Équipe d'agents ---------- */
const AGENTS = [
  { id:'df',     n:'Directeur Financier',    ic:'compass', lead:true },
  { id:'strat',  n:'Stratège',               ic:'chart' },
  { id:'treso',  n:'Trésorier',              ic:'wallet' },
  { id:'fisc',   n:'Fiscaliste',             ic:'percent' },
  { id:'risk',   n:'Contrôleur des risques', ic:'shield' },
  { id:'assist', n:'Assistant de direction', ic:'clipboard' }

$('#agents').innerHTML = AGENTS.map(a =>

     <span class="ic">${icon(a.ic, 13)}</span>
     <span class="tx"><span class="nm">${a.n}</span><span class="st"></span></span>
   </div>`).join('');

function agSet(id, state, txt){
  const el = $('#ag-' + id);
  el.classList.remove('active', 'done');
  if (state) el.classList.add(state);
  el.querySelector('.st').textContent = txt || '';
}
function agReset(){ AGENTS.forEach(a => agSet(a.id, null, '')); }

/* ---------- Helpers d'animation ---------- */
function typeText(el, txt, speed, done){
  if (RM){ if ('value' in el) el.value = txt; else el.textContent = txt; done && done(); return; }
  let i = 0;
  (function step(){
    if (i <= txt.length){
      if ('value' in el && el.tagName === 'INPUT') el.value = txt.slice(0, i); else el.textContent = txt.slice(0, i);
      i++;
      timers.push(setTimeout(step, speed));
    } else done && done();
  })();
}

const seg = (t, b) => ({ t, b });
const answerHTML = segs => segs.map(s =>
  s.t.split(/\s+/).map(w => `<span class="w${s.b ? ' b' : ''}">${w}</span>`).join(' ')
).join(' ');
function revealWords(el){
  [...el.querySelectorAll('.w')].forEach((w, i) => after(60 + i * 26, () => w.classList.add('in')));
}

function addBlock(html, opts){
  opts = opts || {};
  const d = document.createElement('div');
  d.className = 'block' + (opts.span ? ' span2' : '') + (opts.cls ? ' ' + opts.cls : '');
  d.innerHTML = html;
  canvas.appendChild(d);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('in')));
  /* embed: pas d'auto-scroll interne (évite de capturer le scroll de la page hôte) */
  return d;
}
const bhead = (tag, agent, extra) =>
  `<div class="bhead"><span class="btag">${tag}</span><span class="bsep">·</span><span class="bagent">${agent}</span>${extra || ''}</div>`;
const bfoot = src =>
  `<div class="bfoot"><span class="src">${src}</span><span class="verif">${icon('check', 11, 2.2)} vérifié</span></div>`;

/* ---------- Cycle question → réponse ---------- */
function submitQuestion(q){
  greet.classList.add('gone');
  asked.classList.remove('hidden');
  asked.querySelector('.q').textContent = q;
  requestAnimationFrame(() => asked.classList.add('in'));
  input.value = '';
  input.placeholder = 'Pose une autre question…';
  ask.classList.add('busy');
}
function finishScenario(){
  ask.classList.remove('busy');
  routing.textContent = '';
  chips.classList.add('in');
}
function hideToast(){
  toast.classList.remove('in');
  setTimeout(() => toast.classList.add('hidden'), 450);
}
function showToast(){
  toast.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('in')));
}

  const el = addBlock(html);
  after(220, () => el.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w));
  return el;
}

function blockTreso(){
  const W = 600, H = 238, pl = 38, pr = 14, pt = 18, pb = 30, ymax = 240;
  const GOLD = [218,210,196,183,168,150,131,110,86,61,38,54];
  const GRAY = [218,199,178,158,136,113,89,64,38,16,9,26];
  const MO = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
  const X = i => pl + i * (W - pl - pr) / 11;
  const Y = v => pt + (1 - v / ymax) * (H - pt - pb);
  const P = a => a.map((v, i) => ({ x: X(i), y: Y(v) }));
  const sm = p => {
    let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
    for (let i = 0; i < p.length - 1; i++){
      const a = p[Math.max(0, i - 1)], b = p[i], c = p[i + 1], e = p[Math.min(p.length - 1, i + 2)];
      d += `C${(b.x + (c.x - a.x) / 6).toFixed(1)},${(b.y + (c.y - a.y) / 6).toFixed(1)} ${(c.x - (e.x - b.x) / 6).toFixed(1)},${(c.y - (e.y - b.y) / 6).toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)}`;
    }
    return d;
  };
  const pg = sm(P(GOLD)), pd = sm(P(GRAY));
  const area = pg + `L${X(11).toFixed(1)},${Y(0).toFixed(1)} L${X(0).toFixed(1)},${Y(0).toFixed(1)} Z`;
  const grid = [120, 240].map(v =>
    `<line class="axis" x1="${pl}" y1="${Y(v)}" x2="${W - pr}" y2="${Y(v)}"/>`).join('');
  const ylabs = [0, 120, 240].map(v =>
    `<text class="ylab" x="${pl - 7}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const zline = `<line class="zline" x1="${pl}" y1="${Y(0)}" x2="${W - pr}" y2="${Y(0)}"/>`;
  const mons = MO.map((m, i) =>
    `<text class="mlab" x="${X(i)}" y="${H - 9}" text-anchor="middle">${m}</text>`).join('');
  const lx = X(10), lyG = Y(38), lyD = Y(9);

  const html = bhead('Trésorerie · 12 mois', 'Trésorier',
    `<span class="legend mla"><span class="li"><i class="lg"></i>embauche mars</span><span class="li"><i class="lg d"></i>dès janvier</span></span>`) + `
    <svg class="tchart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Trésorerie prévisionnelle sur 12 mois">
      <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f0c949" stop-opacity=".55"/><stop offset="1" stop-color="#f0c949" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${zline}${ylabs}${mons}
      <path class="area" d="${area}"/>
      <path class="cgray" d="${pd}"/>
      <path class="cgold" d="${pg}"/>
      <g class="lowg">
        <circle class="halo" cx="${lx}" cy="${lyG}" r="9"/>
        <circle class="dot" cx="${lx}" cy="${lyG}" r="4"/>
        <text class="lmain" x="${lx - 11}" y="${lyG - 16}" text-anchor="end">+38 k€</text>
        <text class="lsub" x="${lx - 11}" y="${lyG - 5}" text-anchor="end">point bas · novembre</text>
        <text class="lbad" x="${lx - 11}" y="${lyD + 14}" text-anchor="end">+9 k€ si janvier</text>
      </g>
    </svg>` + bfoot('comptes 512 · échéanciers clients & fournisseurs');
  const el = addBlock(html);
  after(260, () => {
    const p = el.querySelector('.cgold');
    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    void p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset 1.9s cubic-bezier(.3,.7,.3,1)';
    p.style.strokeDashoffset = '0';
    const g = el.querySelector('.cgray');
    g.style.opacity = '0';
    g.style.transition = 'opacity 1s ease .7s';
    requestAnimationFrame(() => g.style.opacity = '.85');
    after(1450, () => el.querySelector('.area').classList.add('in'));
    after(1950, () => el.querySelector('.lowg').classList.add('in'));
  });
  return el;
}

function blockSynth(segs, src){
  const html = bhead('Synthèse', 'Directeur Financier',

function blockAction(o){

/* ---------- Chips d'exploration ---------- */
const CHIPS = [
  { k: 'relances', t: 'Quels clients dois-je relancer cette semaine ?' },
  { k: 'tva',      t: 'Suis-je en règle pour ma prochaine TVA ?' },
  { k: 'marge',    t: 'Pourquoi ma marge baisse ce trimestre ?' }
];
chips.innerHTML = '<span class="chiplabel">Explorer</span>' + CHIPS.map(c =>
  `<button class="chip" type="button" data-k="${c.k}">${icon('chevron', 12, 2.2)}<span>${c.t}</span></button>`).join('');
chips.querySelectorAll('.chip').forEach(b =>
  b.addEventListener('click', () => play(b.dataset.k)));

/* ---------- Moteur de scénarios ---------- */
function resetStage(){
  clearTimers();
  agReset();
  canvas.innerHTML = '';
  chips.classList.remove('in');
  hideToast();
  ask.classList.remove('busy');
  routing.textContent = '';
}

function play(key){
  resetStage();
  const sc = SCEN[key];
  input.readOnly = true;
  typeText(input, sc.q, sc.speed || 30, () =>
    after(280, () => {
      submitQuestion(sc.q);
      input.readOnly = false;
      sc.run();
    })
  );
}

function route(q){
  const t = q.toLowerCase();
  if (t.includes('relanc') || t.includes('client')) return 'relances';
  if (t.includes('tva')) return 'tva';
  if (t.includes('marge')) return 'marge';
  if (t.includes('recrut') || t.includes('embauch') || t.includes('tréso') || t.includes('treso') || t.includes('personne')) return 'main';
  return 'unknown';
}

function submitManual(q){
  if (!q || !q.trim()) return;
  resetStage();
  submitQuestion(q.trim());
  SCEN[route(q)].run();
}

/* ---------- Événements ---------- */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !input.readOnly) submitManual(input.value);
});
$('#sendBtn').addEventListener('click', () => { if (!input.readOnly) submitManual(input.value); });
$('#replayBtn').addEventListener('click', () => play('main'));
$('#tLater').addEventListener('click', hideToast);
$('#tClose').addEventListener('click', hideToast);
$('#tYes').addEventListener('click', () => { hideToast(); play('relances'); });

/* ---------- Lancement ---------- */
/* ---- Intégration landing : hauteur auto + démarrage à l'entrée en vue ---- */
let __vzStarted = false;
function __vzStart(){ if (__vzStarted) return; __vzStarted = true; play('main'); }
// scrollHeight (et NON getBoundingClientRect) : capture le contenu qui déborde
// quand l'iframe a une hauteur fixe imposée par la page hôte.
function __vzH(){
  const b = document.body, h = document.documentElement;
  return Math.max(
    b ? b.scrollHeight : 0,
    h ? h.scrollHeight : 0,
    b ? Math.ceil(b.getBoundingClientRect().height) : 0
  );
}
function __vzPostHeight(){
  try { parent.postMessage({ type:'vz-twin-height', h: __vzH() }, '*'); } catch(e){}
}
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'vz-twin-start') __vzStart();
});
// On observe le body (sa boîte grandit avec le contenu, contrairement à <html> clampé au viewport)
if (window.ResizeObserver) {
  const ro = new ResizeObserver(__vzPostHeight);
  ro.observe(document.body);
  ro.observe(document.documentElement);
}
// Filet de sécurité : republication continue (message minuscule, ignoré si hauteur inchangée côté hôte).
setInterval(__vzPostHeight, 350);
setTimeout(__vzPostHeight, 400);
// Le script s'exécute en fin de <body> : le DOM est prêt, inutile d'attendre 'load'
// (dont le handler peut ne jamais se déclencher dans certains contextes embarqués).
try { parent.postMessage({ type:'vz-twin-ready' }, '*'); } catch(e){}
// Autonome : lecture immédiate. Embarqué : la page hôte déclenche « à l'écran »,
// avec un filet de sécurité (jamais bloqué ; l'état initial reste interactif).
setTimeout(__vzStart, (window.parent === window) ? 700 : 3500);
</script>
