<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>VYZOR — Fonctionnalités (orbital)</title>
  <meta name="description" content="Toutes les fonctionnalités de VYZOR pour comptables, DAF et dirigeants. Reporting, prévisions, alertes." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/svg+xml" href="vyzor-mark.svg" />
  <meta name="theme-color" content="#0f1530" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="responsive.css" />
  <style>
    :root {
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --font-display: var(--font-sans);
      --font-text: var(--font-sans);
    }
    html, body, #root { margin: 0; padding: 0; }
    html, body { background: #070a14; }
    html { scroll-behavior: smooth; scroll-padding-top: 110px; }

    .vz-reveal {
      opacity: 0; transform: translateY(28px);
      transition: opacity 800ms cubic-bezier(0.22, 1, 0.36, 1), transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .vz-reveal.in { opacity: 1; transform: none; }
    .vz-reveal.in + .vz-reveal.in { transition-delay: 60ms; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .vz-reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11", "calt";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: rgba(255,255,255,0.92);
      overflow-x: hidden;
    }
    button, input, textarea, select { font-family: inherit; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); letter-spacing: -0.02em; }
    code, kbd, samp, pre { font-family: var(--font-mono); }
    * { box-sizing: border-box; }
    a { color: inherit; }
    ::selection { background: rgba(240,201,73,0.35); color: #fff; }

    .pg-hero {
      position: relative;
      max-width: 1180px;
      margin: 0 auto;
      padding: 180px clamp(24px, 6vw, 96px) 8px;
      text-align: left;
    }
    .pg-title {
      font-size: clamp(40px, 6vw, 76px);
      line-height: 1.02; letter-spacing: -0.03em;
      font-weight: 600; margin: 0 0 22px; max-width: 900px;
      color: #fff;
    }
    .pg-title em {
      font-style: normal;
      background: linear-gradient(135deg, #f6dfa1 0%, #f0c949 50%, #c89a2f 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .pg-lede {
      font-size: 18px; line-height: 1.6;
      color: rgba(255,255,255,0.6);
      max-width: 640px; margin: 0;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="max-width:760px;margin:0 auto;padding:64px 24px;font-family:system-ui,-apple-system,sans-serif;color:#e7e9f0;line-height:1.6;">
      <h1 style="font-size:32px;margin:0 0 16px;">Une plateforme, trois métiers</h1>
      <p style="font-size:17px;color:#aab;margin:0 0 24px;">Toutes les fonctionnalités de VYZOR pour comptables, DAF et dirigeants : reporting, prévisions et alertes.</p>
      <nav style="font-size:15px;font-weight:600;"><a href="index.html" style="color:#f0c949;margin-right:18px;">Accueil</a><a href="securite.html" style="color:#f0c949;margin-right:18px;">Sécurité</a><a href="calculateurs.html" style="color:#f0c949;margin-right:18px;">Calculateurs</a></nav>
    </div>
  </noscript>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="glow-border.jsx"></script>
  <script type="text/babel" src="variant-a.jsx"></script>
  <script type="text/babel" src="features-orbital.jsx"></script>
  <script type="text/babel" src="beta-glass.jsx"></script>
  <script type="text/babel" src="footer-glass.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "autoRotate": true,
      "speed": 0.24,
      "radius": 250,
      "showRing": true,
      "labelsMode": "always"
    }/*EDITMODE-END*/;

    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />

          <div style={{
            background: "#070a14",
            backgroundImage:
              "linear-gradient(180deg, #070a14 0%, rgba(7,10,20,0.78) 11%, rgba(7,10,20,0.32) 22%, transparent 34%), radial-gradient(60% 40% at 15% 0%, rgba(99,102,241,0.18), transparent 60%), radial-gradient(50% 40% at 90% 10%, rgba(240,201,73,0.14), transparent 60%), radial-gradient(40% 30% at 50% 100%, rgba(45,212,191,0.10), transparent 60%)",
            color: text,
            position: "relative",
            overflow: "hidden",
            paddingBottom: 56,
          }}>
            <header className="pg-hero vz-reveal in">
              <h1 className="pg-title">Une plateforme, <em>trois métiers</em>.</h1>
              <p className="pg-lede">
                VYZOR s'adapte à votre rôle. Comptable, DAF ou dirigeant : sélectionnez votre
                profil pour voir uniquement les fonctionnalités qui comptent pour vous.
              </p>
            </header>

            <div className="vz-page-pad" style={{
              maxWidth: 1180,
              margin: "0 auto",
              padding: "0 clamp(24px, 6vw, 96px)",
            }}>
              <div className="vz-reveal">
                <FeaturesOrbital
                  autoRotate={t.autoRotate}
                  speed={Number(t.speed)}
                  radius={Number(t.radius)}
                  showRing={t.showRing}
                  labelsMode={t.labelsMode}
                />
              </div>
              <div className="vz-reveal"><BetaFormGlass /></div>
            </div>

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Orbite" />
            <TweakToggle label="Rotation auto" value={t.autoRotate}
              onChange={(v) => setTweak("autoRotate", v)} />
            <TweakSlider label="Vitesse" value={t.speed} min={0.02} max={0.24} step={0.02}
              onChange={(v) => setTweak("speed", v)} />
            <TweakSlider label="Rayon" value={t.radius} min={150} max={250} step={5} unit="px"
              onChange={(v) => setTweak("radius", v)} />
            <TweakSection label="Affichage" />
            <TweakToggle label="Anneau visible" value={t.showRing}
              onChange={(v) => setTweak("showRing", v)} />
            <TweakRadio label="Libellés" value={t.labelsMode}
              options={[{ value: "always", label: "Toujours" }, { value: "hover", label: "Au focus" }]}
              onChange={(v) => setTweak("labelsMode", v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
