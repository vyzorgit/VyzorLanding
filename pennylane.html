  <script type="text/babel">
    
    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />
          <StickyBetaCta />

          <div style={{
            background: "#0a1026",
            backgroundImage: "radial-gradient(ellipse 80% 40% at 50% 0%, #17224f 0%, rgba(10,16,38,0) 70%), linear-gradient(180deg, #0a1026 0%, #0d1430 30%, #0a1026 55%, #0d1430 80%, #0a1026 100%)",
            color: text,
            position: "relative",
            overflow: "hidden",
            paddingBottom: 56,
          }}>
            <main id="contenu" tabIndex={-1} style={{ outline: "none" }}>
            <PennylanePageBody gold={gold} text={text} muted={muted} subtle={subtle} />
            </main>

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
