<script type="text/babel">

const STATUTS = {
  micro_bnc: { label: "Micro-BNC", sub: "Profession libérale < 77 700€", icon: "user", color: "#3b82f6", tva: "franchise", abattement: 0.34, ir: true, is: false, cotisations: 0.22 },
  micro_bic: { label: "Micro-BIC (Services)", sub: "Prestataire < 77 700€", icon: "tools", color: "#8b5cf6", tva: "franchise", abattement: 0.50, ir: true, is: false, cotisations: 0.22 },
  micro_bic_vente: { label: "Micro-BIC (Vente)", sub: "Commerce < 188 700€", icon: "store", color: "#ec4899", tva: "franchise", abattement: 0.71, ir: true, is: false, cotisations: 0.125 },
  eurl_ir: { label: "EURL (IR)", sub: "Assoc. unique, option IR", icon: "building", color: "#C5A059", tva: "normal", abattement: 0, ir: true, is: false, cotisations: 0.45 },
  sas_is: { label: "SAS / SASU", sub: "Président assimilé salarié", icon: "rocket", color: "#C5A059", tva: "normal", abattement: 0, ir: false, is: true, cotisations: 0.82 },
  sarl_is: { label: "SARL / EURL (IS)", sub: "Gérant majoritaire TNS", icon: "scale", color: "#10B981", tva: "normal", abattement: 0, ir: false, is: true, cotisations: 0.45 },
};

const TRANCHES_IR = [
  { min: 0, max: 11294, taux: 0 },
  { min: 11294, max: 28797, taux: 0.11 },
  { min: 28797, max: 82341, taux: 0.30 },
  { min: 82341, max: 177106, taux: 0.41 },
  { min: 177106, max: Infinity, taux: 0.45 },
];

function calcIR(revenu) {
  let impot = 0;
  for (const t of TRANCHES_IR) {
    if (revenu <= t.min) break;
    const base = Math.min(revenu, t.max) - t.min;
    impot += base * t.taux;
  }
  return impot;
}
function calcIS(b) {
  if (b <= 0) return 0;
  if (b <= 42500) return b * 0.15;
  return 42500 * 0.15 + (b - 42500) * 0.25;
}
const TVA_RATE = 0.20;
function simulate(key, ca, charges, remuneration) {
  const s = STATUTS[key];
  const isMicro = key.startsWith("micro");
  let tvaColl = 0, tvaDeduc = 0, tvaNette = 0, caHT = ca;
  if (s.tva === "normal") {
    tvaColl = ca * TVA_RATE;
    tvaDeduc = charges * TVA_RATE * 0.6;
    tvaNette = tvaColl - tvaDeduc;
  }
  let revenuImposable = 0, impot = 0, cotisationsSociales = 0, net = 0;
  if (isMicro) {
    revenuImposable = caHT * (1 - s.abattement);
    impot = calcIR(revenuImposable);
    cotisationsSociales = caHT * s.cotisations;
    net = caHT - impot - cotisationsSociales;
  } else if (s.is) {
    cotisationsSociales = remuneration * s.cotisations;
    const benefice = Math.max(0, caHT - charges - remuneration - cotisationsSociales);
    const is = calcIS(benefice);
    const irDir = calcIR(remuneration * 0.9);
    impot = is + irDir;
    net = caHT - charges - cotisationsSociales - impot - tvaNette;
  } else {
    cotisationsSociales = (caHT - charges) * s.cotisations * 0.65;
    revenuImposable = Math.max(0, caHT - charges - cotisationsSociales);
    impot = calcIR(revenuImposable);
    net = caHT - charges - cotisationsSociales - impot - tvaNette;
  }
  const tauxPrelevement = ca > 0 ? ((impot + cotisationsSociales + tvaNette) / ca) * 100 : 0;
  return { caHT, tvaColl, tvaDeduc, tvaNette, revenuImposable, impot, cotisationsSociales, net: Math.max(0, net), tauxPrelevement, charges: isMicro ? 0 : charges, remuneration: s.is ? remuneration : 0 };
}

function ComparisonChart({ data }) {
  const W = 880, H = 340, PAD = { top: 24, right: 20, bottom: 70, left: 60 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;
  const maxVal = Math.max(...data.map(d => d.Impôts + d.Cotisations + d["TVA nette"] + d["Net restant"]), 1);
  const barW = plotW / data.length * 0.55;
  const gap = plotW / data.length * 0.45;
  const fmt = (v) => v >= 1000 ? `${(v/1000).toFixed(0)}k` : v.toFixed(0);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      {[0, 0.25, 0.5, 0.75, 1].map((p, i) => {
        const yV = PAD.top + plotH * (1 - p);
        return (
          <g key={i}>
            <line x1={PAD.left} y1={yV} x2={W - PAD.right} y2={yV} stroke={T.borderSubtle} strokeDasharray="3 3" />
            <text x={PAD.left - 8} y={yV + 4} fill={T.textMuted} fontSize="10" fontFamily={T.mono} textAnchor="end">{fmt(maxVal * p)} €</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const cx = PAD.left + (i + 0.5) * (plotW / data.length);
        const xBar = cx - barW / 2;
        let yCursor = PAD.top + plotH;
        const segments = [
          { v: d["Net restant"], c: T.success },
          { v: d["TVA nette"], c: T.warning },
          { v: d.Cotisations, c: "#8b5cf6" },
          { v: d.Impôts, c: T.error },
        ];
        return (
          <g key={i}>
            {segments.map((seg, j) => {
              const h = (seg.v / maxVal) * plotH;
              yCursor -= h;
              return <rect key={j} x={xBar} y={yCursor} width={barW} height={h} fill={seg.c} opacity={0.85}
                rx={j === segments.length - 1 ? 4 : 0} />;
            })}
            <text x={cx} y={H - PAD.bottom + 16} fill={T.textMuted} fontSize="10" textAnchor="middle">
              {d.label.length > 14 ? d.label.slice(0, 12) + "…" : d.label}
            </text>
            <text x={cx} y={H - PAD.bottom + 30} fill={T.success} fontSize="11" fontFamily={T.mono} fontWeight="700" textAnchor="middle">
              {fmt(d["Net restant"])} €
            </text>
          </g>
        );
      })}
      {/* Legend */}
      <g transform={`translate(${PAD.left}, 0)`}>
        {[
          { l: "Impôts", c: T.error },
          { l: "Cotisations", c: "#8b5cf6" },
          { l: "TVA", c: T.warning },
          { l: "Net", c: T.success },
        ].map((it, i) => (
          <g key={i} transform={`translate(${i * 80}, 0)`}>
            <rect x={0} y={4} width={10} height={10} fill={it.c} rx={2} />
            <text x={14} y={13} fill={T.textMuted} fontSize="11">{it.l}</text>
          </g>
        ))}
      </g>
    </svg>
  );
}

function App() {
  const [statut, setStatut] = React.useState("sas_is");
  const [ca, setCa] = React.useState(120000);
  const [charges, setCharges] = React.useState(25000);

  const s = STATUTS[statut];
  const isMicro = statut.startsWith("micro");
  const isIS = s.is;
  const result = simulate(statut, ca, charges, remuneration);

  const chartData = Object.entries(STATUTS).map(([key, st]) => {
    const r = simulate(key, ca, charges, remuneration);
    return {
      label: st.label, color: st.color,
      "Impôts": Math.round(r.impot),

  return (

        }}>← Tous les calculateurs</a>

        <div style={{ textAlign: "center", marginBottom: 48 }}>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 10,
            fontFamily: T.mono, fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase",
            color: T.textMuted, marginBottom: 20,
          }}>
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
            Calcul instantané — IS · IR · TVA
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
          </div>
          <h1 style={{ fontSize: 38, fontWeight: 800, letterSpacing: -1, margin: "0 0 12px", lineHeight: 1.15 }}>
            Simulateur <span style={{ background: goldGradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>IS, IR & TVA</span> par statut
          </h1>
          <p style={{ color: T.textMuted, fontSize: 16, maxWidth: 600, margin: "0 auto" }}>
            Comparez instantanément votre fiscalité selon votre forme juridique. SAS, SARL, micro-entreprise — chaque statut a ses propres règles.
          </p>
        </div>

        <div style={{ marginBottom: 32 }}>
          <div style={{ color: T.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 12 }}>Choisissez votre statut juridique</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(155px, 1fr))", gap: 10 }}>
            {Object.entries(STATUTS).map(([id, st]) => (
              <StatutCard key={id} id={id} statut={st} selected={statut} onClick={setStatut} />
            ))}
          </div>
        </div>

        <div className="calc-2col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 32 }}>
          <SlabCard>
            <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 20 }}>Paramètres</div>
            <Slider label="Chiffre d'affaires HT" value={ca} onChange={setCa} min={10000} max={500000} step={5000} unit=" €" icon="euro" />
            {!isMicro && (
              <React.Fragment>
                <Slider label="Charges d'exploitation" value={charges} onChange={setCharges} min={0} max={200000} step={2500} unit=" €" icon="box" />
                {isIS && <Slider label="Rémunération dirigeant" value={remuneration} onChange={setRemuneration} min={0} max={150000} step={2000} unit=" €" icon="briefcase" />}
              </React.Fragment>
            )}
            <div style={{ marginTop: 16, padding: "14px 16px", background: `${s.color}10`, border: `1px solid ${s.color}30`, borderRadius: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: s.color, marginBottom: 6, display: "inline-flex", alignItems: "center", gap: 8 }}>
                <Icon name={s.icon} size={14} color={s.color} /> {s.label}
              </div>
              <div style={{ fontSize: 12, color: T.textSecondary }}>
                {s.tva === "franchise" ? "Franchise en base de TVA" : `TVA collectée : ${Math.round(result.tvaColl).toLocaleString("fr-FR")}€ | déductible : ${Math.round(result.tvaDeduc).toLocaleString("fr-FR")}€`}
              </div>
              <div style={{ fontSize: 12, color: T.textSecondary, marginTop: 4 }}>
                {s.ir ? `IR — Abattement ${s.abattement > 0 ? (s.abattement * 100) + "%" : "charges réelles"}` : `IS — 15% jusqu'à 42 500€ puis 25%`}
              </div>
            </div>
          </SlabCard>

          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ background: T.bgSurface, border: `1px solid ${T.borderSolid}`, borderRadius: 12, padding: "18px 20px" }}>
              <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Résultat net estimé</div>
              <div style={{ fontSize: 24 }}><AnimatedNumber value={Math.round(result.net)} suffix=" €" /></div>
              <div style={{ color: T.textMuted, fontSize: 11, marginTop: 6 }}>Ce qu'il vous reste après tous prélèvements</div>
            </div>
            <div style={{ background: T.bgSurface, border: `1px solid ${T.borderSolid}`, borderRadius: 12, padding: "18px 20px" }}>
              <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Total impôts</div>
              <div style={{ fontSize: 24, color: T.error, fontFamily: T.mono, fontWeight: 700 }}><AnimatedNumber value={Math.round(result.impot)} suffix=" €" /></div>
              <div style={{ color: T.textMuted, fontSize: 11, marginTop: 6 }}>{s.is ? "IS société + IR dirigeant" : "Impôt sur le revenu"}</div>
            </div>
            <div style={{ background: T.bgSurface, border: `1px solid ${T.borderSolid}`, borderRadius: 12, padding: "18px 20px" }}>
              <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Cotisations sociales</div>
              <div style={{ fontSize: 24, color: "#8b5cf6", fontFamily: T.mono, fontWeight: 700 }}><AnimatedNumber value={Math.round(result.cotisationsSociales)} suffix=" €" /></div>
            </div>
            <div style={{ background: `${result.tauxPrelevement > 50 ? T.error : result.tauxPrelevement > 35 ? T.warning : T.success}12`, border: `1px solid ${result.tauxPrelevement > 50 ? T.error : result.tauxPrelevement > 35 ? T.warning : T.success}40`, borderRadius: 12, padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ color: T.textSecondary, fontSize: 12 }}>Taux de prélèvement global</span>
              <span style={{ color: result.tauxPrelevement > 50 ? T.error : result.tauxPrelevement > 35 ? T.warning : T.success, fontFamily: T.mono, fontWeight: 700, fontSize: 22 }}>{Math.round(result.tauxPrelevement)}%</span>
            </div>
          </div>
        </div>

        <SlabCard style={{ position: "relative", overflow: "hidden", marginBottom: 32 }}>
          <h3 style={{ margin: 0, fontSize: 18, fontWeight: 700 }}>Comparaison par statut juridique</h3>
          <p style={{ margin: "4px 0 20px", color: T.textMuted, fontSize: 13 }}>Net restant après impôts, cotisations et TVA — même CA</p>
          <div style={{ filter: gated ? "blur(8px)" : "none", transition: "filter 0.5s", pointerEvents: gated ? "none" : "auto" }}>
            <ComparisonChart data={chartData} />
          </div>
          {gated && <EmailGate onSubmit={() => setGated(false)} icon="lock" title="Rapport fiscal détaillé" desc="Obtenez le comparatif complet entre tous les statuts juridiques." />}
        </SlabCard>

        <CtaFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
