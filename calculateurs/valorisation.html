      {methods.map((m) => {

}

/* ── Result row — single bold figure block ── */
function ResultBlock({ label, value, hint }) {

}

/* ── Comparison bars ── */
function ComparisonBars({ rows }) {
  const maxVal = Math.max(...rows.map((r) => r.value).filter((v) => v > 0), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {rows.map((r) => {
        const pct = (r.value / maxVal) * 100;
        const isMax = r.value === maxVal && r.value > 0;
        return (
          <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <div style={{ width: 150, fontSize: 13, color: isMax ? T.brandGold : T.textSecondary, fontWeight: isMax ? 600 : 500, flexShrink: 0 }}>
              {r.label}
            </div>
            <div style={{
              flex: 1, height: 32,
              background: "rgba(255,255,255,0.03)",
              border: "1px solid rgba(255,255,255,0.06)",
              borderRadius: 8,
              overflow: "hidden", position: "relative",
            }}>
              <div style={{
                width: Math.max(pct, 4) + "%",
                height: "100%",
                background: isMax
                  ? `linear-gradient(90deg, rgba(197,160,89,0.35), rgba(197,160,89,0.65))`
                  : "linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.14))",
                borderRight: isMax ? `1px solid ${T.brandGold}` : "1px solid rgba(255,255,255,0.12)",
                transition: "width 700ms cubic-bezier(0.22,1,0.36,1)",
                display: "flex", alignItems: "center", paddingLeft: 14,
              }}>
                <span style={{ fontSize: 12, fontWeight: 700, fontFamily: T.mono, color: "#fff", whiteSpace: "nowrap" }}>
                  {fmtShort(r.value)}
                </span>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function fmt(n) {
  if (!isFinite(n) || isNaN(n)) return "—";
  return Math.round(n).toLocaleString("fr-FR") + " €";
}
function fmtShort(n) {
  if (!isFinite(n) || isNaN(n) || n === 0) return "—";
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace(".", ",") + " M€";
  if (n >= 1e3) return Math.round(n / 1e3) + " k€";
  return Math.round(n).toLocaleString("fr-FR") + " €";
}

const SECTORS_CA = [
  { value: "1.5", label: "Commerce / Retail" },
  { value: "2.5", label: "Services / Conseil" },

const RECURRENCE = [
  { value: "0.85", label: "One-shot" },
  { value: "1",    label: "Mixte" },
  { value: "1.2",  label: "Récurrent / Abonnement" },
];
const SECTORS_EBITDA = [
  { value: "5",  label: "Commerce / Retail" },
  { value: "7",  label: "Services / Conseil" },
  { value: "12", label: "SaaS / Tech" },
  { value: "6",  label: "Industrie" },

];

function App() {
  const [method, setMethod] = React.useState("ca");
  const [emailSubmitted, setEmailSubmitted] = React.useState(false);

  // CA
  const [caRev, setCaRev] = React.useState(500000);
  const [caGrowth, setCaGrowth] = React.useState(25);
  const [caSector, setCaSector] = React.useState("5");
  const [caRecur, setCaRecur] = React.useState("1.2");

  // EBITDA
  const [ebRev, setEbRev] = React.useState(500000);
  const [ebMargin, setEbMargin] = React.useState(20);
  const [ebSector, setEbSector] = React.useState("12");
  const [ebGrowth, setEbGrowth] = React.useState(25);

  // DCF
  const [fcf, setFcf] = React.useState(80000);
  const [dcfGrowth, setDcfGrowth] = React.useState(20);
  const [wacc, setWacc] = React.useState(12);
  const [terminal, setTerminal] = React.useState(2);

  // Patrimoine
  const [immo, setImmo] = React.useState(300000);
  const [stocks, setStocks] = React.useState(150000);
  const [cash, setCash] = React.useState(80000);
  const [debt, setDebt] = React.useState(200000);
  const [goodwill, setGoodwill] = React.useState(100000);

  // === CA ===
  const caCalc = React.useMemo(() => {
    const sectorMult = parseFloat(caSector);
    const recurMult = parseFloat(caRecur);
    let growthAdj = 0;
    if (caGrowth > 15) growthAdj = (caGrowth - 15) / 10 * 0.5;
    if (caGrowth < 5) growthAdj = -0.5;
    const finalMult = Math.max(0.5, (sectorMult + growthAdj) * recurMult);
    return { value: caRev * finalMult, mult: finalMult };
  }, [caRev, caGrowth, caSector, caRecur]);

  // === EBITDA ===
  const ebitdaCalc = React.useMemo(() => {
    const sectorMult = parseFloat(ebSector);
    const ebitda = ebRev * (ebMargin / 100);
    let growthAdj = 0;
    if (ebGrowth > 15) growthAdj = (ebGrowth - 15) / 10 * 1;
    if (ebGrowth < 5) growthAdj = -1;
    const finalMult = Math.max(2, sectorMult + growthAdj);
    return { value: ebitda * finalMult, ebitda, mult: finalMult };
  }, [ebRev, ebMargin, ebSector, ebGrowth]);

  // === DCF ===
  const dcfCalc = React.useMemo(() => {
    const g = dcfGrowth / 100;
    const w = Math.max(0.001, wacc / 100);
    const gT = terminal / 100;
    let flowsSum = 0;
    let currentFCF = fcf;
    for (let y = 1; y <= 5; y++) {
      currentFCF = currentFCF * (1 + g);
      flowsSum += currentFCF / Math.pow(1 + w, y);
    }
    const fcf6 = currentFCF * (1 + gT);
    const terminalVal = (w > gT) ? fcf6 / (w - gT) : 0;
    const pvTerminal = terminalVal / Math.pow(1 + w, 5);
    return { value: flowsSum + pvTerminal, flows: flowsSum, terminal: pvTerminal };
  }, [fcf, dcfGrowth, wacc, terminal]);

  // === Patrimoine ===
  const patCalc = React.useMemo(() => {
    const anc = immo + stocks + cash - debt;
    return { value: anc + goodwill, anc };
  }, [immo, stocks, cash, debt, goodwill]);

  const allValues = [
    { id: "ca",     label: "Multiples de CA",      value: caCalc.value },
    { id: "ebitda", label: "Multiples d'EBITDA",   value: ebitdaCalc.value },
    { id: "dcf",    label: "DCF actualisé",        value: dcfCalc.value },
    { id: "pat",    label: "Patrimoine net",       value: patCalc.value },
  ];
  const positive = allValues.filter(v => v.value > 0).map(v => v.value);
  const avg = positive.length ? positive.reduce((a, b) => a + b, 0) / positive.length : 0;
  const lo = positive.length ? Math.min(...positive) : 0;
  const hi = positive.length ? Math.max(...positive) : 0;

  const methods = [
    { id: "ca",     icon: "bars",     label: "Multiples CA" },
    { id: "ebitda", icon: "trend",    label: "Multiples EBITDA" },
    { id: "dcf",    icon: "scale",    label: "DCF" },
    { id: "pat",    icon: "building", label: "Patrimoine" },
  ];

  const methodMeta = {
    ca: {
      title: "Méthode des multiples de chiffre d'affaires",
      desc: "Approche rapide, idéale pour les sociétés en forte croissance ou aux marges encore négatives.",
    },
    ebitda: {
      title: "Méthode des multiples d'EBITDA",
      desc: "La référence des fonds d'investissement et acquéreurs industriels.",
    },
    dcf: {
      title: "Discounted Cash Flow — modèle simplifié",
      desc: "Projection des flux de trésorerie sur 5 ans, actualisée à la valeur d'aujourd'hui.",
    },
    pat: {
      title: "Approche patrimoniale (Actif Net Corrigé)",
      desc: "Plancher de valorisation basé sur la valeur réelle des actifs, dettes déduites.",
    },
  };

  return (
    <div style={{ minHeight: "100vh", background: T.bgBase, color: T.textPrimary }}>
      <PageBg />
      <VyzorTopNav current="hub" />

      <div style={{ position: "relative", zIndex: 1, maxWidth: 1040, margin: "0 auto", padding: "120px 20px 48px" }}>
        <a href="../calculateurs.html" style={{
          display: "inline-flex", alignItems: "center", gap: 6, color: T.textMuted,
          fontSize: 12, textDecoration: "none", fontFamily: T.mono, letterSpacing: "0.1em",
          textTransform: "uppercase", marginBottom: 24,
        }}>← Tous les calculateurs</a>

        <div style={{ textAlign: "center", marginBottom: 48 }}>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 10,
            fontFamily: T.mono, fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase",
            color: T.textMuted, marginBottom: 24,
          }}>
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
            4 méthodes croisées
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
          </div>
          <h1 style={{ fontSize: "clamp(32px, 5vw, 52px)", fontWeight: 700, lineHeight: 1.08, marginBottom: 20, letterSpacing: "-0.02em" }}>
            Estimez la <span style={{ color: T.brandGold }}>valorisation</span><br/>de votre entreprise
          </h1>
          <p style={{ color: T.textSecondary, fontSize: 17, maxWidth: 600, margin: "0 auto", lineHeight: 1.65 }}>
            Comparez quatre méthodes utilisées par les investisseurs et experts-comptables.
            Résultat instantané, comparatif visuel, fourchette de valorisation.
          </p>
        </div>

        <MethodTabs value={method} onChange={setMethod} methods={methods} />

        {/* === MÉTHODE CA === */}
        {method === "ca" && (
          <SlabCard style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <IconChip name="bars" size={36} iconSize={18} tone="gold" />
              <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>{methodMeta.ca.title}</h2>
            </div>
            <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>{methodMeta.ca.desc}</p>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "0 24px", marginBottom: 8 }}>
              <NumberField label="Chiffre d'affaires annuel" icon="euro" value={caRev} onChange={setCaRev} unit="€ / an" step={10000} />
              <NumberField label="Croissance annuelle" icon="trend" value={caGrowth} onChange={setCaGrowth} unit="%" step={1} />
              <SelectField label="Secteur d'activité" icon="briefcase" value={caSector} onChange={setCaSector} options={SECTORS_CA} />
              <SelectField label="Récurrence du revenu" icon="rocket" value={caRecur} onChange={setCaRecur} options={RECURRENCE} />
            </div>

            <ResultBlock
              label="Valorisation estimée"
              value={fmt(caCalc.value)}
              hint={`Multiple appliqué · ${caCalc.mult.toFixed(1)}× CA`}
            />
          </SlabCard>
        )}

        {/* === MÉTHODE EBITDA === */}
        {method === "ebitda" && (
          <SlabCard style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <IconChip name="trend" size={36} iconSize={18} tone="gold" />
              <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>{methodMeta.ebitda.title}</h2>
            </div>
            <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>{methodMeta.ebitda.desc}</p>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "0 24px" }}>
              <NumberField label="Chiffre d'affaires annuel" icon="euro" value={ebRev} onChange={setEbRev} unit="€ / an" step={10000} />
              <NumberField label="Marge EBITDA" icon="scale" value={ebMargin} onChange={setEbMargin} unit="%" step={1} />
              <SelectField label="Secteur d'activité" icon="briefcase" value={ebSector} onChange={setEbSector} options={SECTORS_EBITDA} />
              <NumberField label="Croissance annuelle" icon="trend" value={ebGrowth} onChange={setEbGrowth} unit="%" step={1} />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
              <div style={{
                padding: "16px 20px", borderRadius: 12,
                background: "rgba(255,255,255,0.03)",
                border: "1px solid rgba(255,255,255,0.08)",
              }}>
                <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 600, marginBottom: 6 }}>EBITDA</div>
                <div style={{ fontSize: 22, fontWeight: 700, fontFamily: T.mono, color: T.textPrimary }}>{fmt(ebitdaCalc.ebitda)}</div>
              </div>
              <div style={{
                padding: "16px 20px", borderRadius: 12,
                background: "rgba(255,255,255,0.03)",
                border: "1px solid rgba(255,255,255,0.08)",
              }}>
                <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 600, marginBottom: 6 }}>Multiple</div>
                <div style={{ fontSize: 22, fontWeight: 700, fontFamily: T.mono, color: T.textPrimary }}>{ebitdaCalc.mult.toFixed(1)}×</div>
              </div>
            </div>

            <ResultBlock
              label="Valorisation estimée"
              value={fmt(ebitdaCalc.value)}
              hint={`EBITDA × ${ebitdaCalc.mult.toFixed(1)}`}
            />
          </SlabCard>
        )}

        {/* === MÉTHODE DCF === */}
        {method === "dcf" && (
          <SlabCard style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <IconChip name="scale" size={36} iconSize={18} tone="gold" />
              <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>{methodMeta.dcf.title}</h2>
            </div>
            <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>{methodMeta.dcf.desc}</p>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "0 24px" }}>
              <NumberField label="Free Cash Flow actuel" icon="euro" value={fcf} onChange={setFcf} unit="€ / an" step={5000} />
              <NumberField label="Croissance FCF (5 ans)" icon="trend" value={dcfGrowth} onChange={setDcfGrowth} unit="%" step={1} />
              <NumberField label="Taux d'actualisation (WACC)" icon="target" value={wacc} onChange={setWacc} unit="%" step={1} />
              <NumberField label="Croissance perpétuelle" icon="clock" value={terminal} onChange={setTerminal} unit="%" step={0.5} />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
              <div style={{
                padding: "16px 20px", borderRadius: 12,
                background: "rgba(255,255,255,0.03)",
                border: "1px solid rgba(255,255,255,0.08)",
              }}>
                <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 600, marginBottom: 6 }}>Flux 5 ans actualisés</div>
                <div style={{ fontSize: 20, fontWeight: 700, fontFamily: T.mono, color: T.textPrimary }}>{fmt(dcfCalc.flows)}</div>
              </div>
              <div style={{
                padding: "16px 20px", borderRadius: 12,
                background: "rgba(255,255,255,0.03)",
                border: "1px solid rgba(255,255,255,0.08)",
              }}>
                <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 600, marginBottom: 6 }}>Valeur terminale</div>
                <div style={{ fontSize: 20, fontWeight: 700, fontFamily: T.mono, color: T.textPrimary }}>{fmt(dcfCalc.terminal)}</div>
              </div>
            </div>

            <ResultBlock
              label="Valorisation DCF totale"
              value={fmt(dcfCalc.value)}
              hint="Flux + valeur terminale"
            />
          </SlabCard>
        )}

        {/* === MÉTHODE PATRIMOINE === */}
        {method === "pat" && (
          <SlabCard style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <IconChip name="building" size={36} iconSize={18} tone="gold" />
              <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>{methodMeta.pat.title}</h2>
            </div>
            <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>{methodMeta.pat.desc}</p>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "0 24px" }}>
              <NumberField label="Actifs immobilisés" icon="building" value={immo} onChange={setImmo} unit="€" step={5000} />
              <NumberField label="Stocks + créances" icon="box" value={stocks} onChange={setStocks} unit="€" step={5000} />
              <NumberField label="Trésorerie disponible" icon="euro" value={cash} onChange={setCash} unit="€" step={5000} />
              <NumberField label="Dettes totales" icon="document" value={debt} onChange={setDebt} unit="€" step={5000} />
              <NumberField label="Goodwill / survaleur" icon="sparkle" value={goodwill} onChange={setGoodwill} unit="€" step={5000} />
            </div>

            <div style={{
              padding: "16px 20px", borderRadius: 12,
              background: "rgba(255,255,255,0.03)",
              border: "1px solid rgba(255,255,255,0.08)",
              marginBottom: 12,
            }}>
              <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.18em", fontWeight: 600, marginBottom: 6 }}>Actif Net Comptable</div>
              <div style={{ fontSize: 22, fontWeight: 700, fontFamily: T.mono, color: T.textPrimary }}>{fmt(patCalc.anc)}</div>
            </div>

            <ResultBlock
              label="Valorisation patrimoniale"
              value={fmt(patCalc.value)}
              hint="ANC + Goodwill"
            />
          </SlabCard>
        )}

        {/* === SYNTHÈSE === */}
        <SlabCard style={{ position: "relative", overflow: "hidden", marginBottom: 32, minHeight: 320 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
            <IconChip name="sparkle" size={36} iconSize={18} tone="gold" />
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Synthèse comparative</h2>
          </div>
          <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>
            Fourchette de valorisation issue des 4 méthodes — la plus pertinente dépend de votre profil.
          </p>

          <div style={{ filter: emailSubmitted ? "none" : "blur(8px)", transition: "filter 0.5s", pointerEvents: emailSubmitted ? "auto" : "none" }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 28 }}>
              <KpiTile label="Plancher" value={fmtShort(lo)} color={T.textSecondary} sub="valeur la plus basse" />
              <KpiTile label="Moyenne" value={fmtShort(avg)} color={T.brandGold} sub="indicatif" />
              <KpiTile label="Plafond" value={fmtShort(hi)} color={T.textSecondary} sub="valeur la plus haute" />
            </div>

            <ComparisonBars rows={allValues} />
          </div>

          {!emailSubmitted && (
            <EmailGate
              onSubmit={() => setEmailSubmitted(true)}
              icon="lock"
              title="Débloquez votre synthèse"
              desc="Comparatif détaillé des 4 méthodes, fourchette de valorisation et recommandation personnalisée selon votre profil."
            />
          )}
        </SlabCard>

        <div style={{
          textAlign: "center", color: T.textMuted, fontSize: 12,
          padding: "8px 0 32px", lineHeight: 1.7,
        }}>
          Estimation indicative — ne constitue pas un conseil financier.<br/>
          Pour une valorisation contractuelle, consultez un expert-comptable ou un évaluateur certifié.
        </div>

        <CtaFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
