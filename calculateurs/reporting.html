      <h2 style="font-size:22px;margin:32px 0 10px;">Questions fréquentes</h2>
      <h3 style="font-size:17px;margin:18px 0 4px;">Comment mesurer la maturité d'un reporting financier ?</h3>
      <p style="margin:0 0 14px;color:#aab;">Quatre critères clés : le temps consacré au reporting, la fiabilité des données, le délai de closing mensuel et la fréquence de mise à jour. Un reporting mature délivre des indicateurs fiables en moins de 5 jours ouvrés.</p>

<script type="text/babel">
function GaugeBar({ label, pct, color }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ color: T.textMuted, fontSize: 13 }}>{label}</span>
        <span style={{ color, fontSize: 13, fontWeight: 700, fontFamily: T.mono }}>{pct}%</span>
      </div>
      <div style={{ background: T.bgElevated, borderRadius: 4, height: 6, overflow: "hidden", border: `1px solid ${T.borderSubtle}` }}>
        <div style={{ width: `${pct}%`, height: "100%",
          background: color === T.brandGold ? goldGradient : `linear-gradient(90deg, ${color}, ${color}88)`,
          borderRadius: 4, transition: "width 0.6s ease" }} />
      </div>
    </div>
  );
}

function ResultCard({ iconName, label, value, color, sub }) {
  return (
    <div style={{
      background: T.bgElevated, borderRadius: 14, padding: "22px 18px",
      border: `1px solid ${T.borderSolid}`, borderTop: `1px solid ${T.borderStrong}`,
      flex: 1, minWidth: 140, textAlign: "left",
    }}>
      {iconName && <div style={{ marginBottom: 12 }}><IconChip name={iconName} size={36} iconSize={18} tone="gold" /></div>}
      <div style={{ color: T.textMuted, fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 8, fontWeight: 600 }}>{label}</div>
      <div style={{ color, fontSize: 26, fontWeight: 700, fontFamily: T.mono }}>{value}</div>
      {sub && <div style={{ color: T.textMuted, fontSize: 11, marginTop: 6 }}>{sub}</div>}
    </div>
  );
}

function App() {
  const [reports, setReports] = React.useState(15);
  const [hoursPerReport, setHoursPerReport] = React.useState(4);
  const [hourlyRate, setHourlyRate] = React.useState(80);
  const [emailSubmitted, setEmailSubmitted] = React.useState(false);
  const [showResults, setShowResults] = React.useState(false);

  const totalHoursMonth = reports * hoursPerReport;
  const totalCostMonth = totalHoursMonth * hourlyRate;
  const totalCostYear = totalCostMonth * 12;
  const vyzorReduction = 0.70;
  const savedHoursMonth = Math.round(totalHoursMonth * vyzorReduction);
  const savedCostMonth = savedHoursMonth * hourlyRate;
  const savedCostYear = savedCostMonth * 12;
  const costPerReport = hoursPerReport * hourlyRate;
  const costPerReportVyzor = Math.round(hoursPerReport * (1 - vyzorReduction) * hourlyRate);
  const daysRecovered = Math.round((savedHoursMonth * 12) / 8);

  const handleEmailSubmit = () => { setEmailSubmitted(true); setShowResults(true); };

  return (
    <div style={{ minHeight: "100vh", background: T.bgBase, color: T.textPrimary }}>
      <PageBg />
      <VyzorTopNav current="hub" />

      <div style={{ position: "relative", zIndex: 1, maxWidth: 920, margin: "0 auto", padding: "120px 20px 48px" }}>

        <a href="../calculateurs.html" style={{
          display: "inline-flex", alignItems: "center", gap: 6, color: T.textMuted,
          fontSize: 12, textDecoration: "none", fontFamily: T.mono, letterSpacing: "0.1em",
          textTransform: "uppercase", marginBottom: 24,
        }}>← Tous les calculateurs</a>

        <div style={{ textAlign: "center", marginBottom: 56 }}>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 10,
            fontFamily: T.mono, fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase",
            color: T.textMuted, marginBottom: 24,
          }}>
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
            Calcul instantané — Reporting
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
          </div>

          <h1 style={{ fontSize: "clamp(34px, 5vw, 54px)", fontWeight: 700, lineHeight: 1.1, marginBottom: 20, letterSpacing: "-0.02em" }}>
            Combien vous coûte votre<br />
            <span style={{ color: T.brandGold }}>reporting manuel</span> ?
          </h1>
          <p style={{ color: T.textSecondary, fontSize: 18, maxWidth: 580, margin: "0 auto", lineHeight: 1.7 }}>
            Dirigeants, DAF, Experts-Comptables : découvrez en
            <span style={{ color: T.textPrimary, fontWeight: 600 }}> 30 secondes </span>
            le coût réel de vos tableaux de bord manuels.
          </p>
        </div>

        <div style={{ display: "flex", gap: 20, flexWrap: "wrap", marginBottom: 56 }}>
          <SlabCard style={{ flex: "1 1 400px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <IconChip name="settings" size={36} iconSize={18} tone="default" />
              <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Vos paramètres</h2>
            </div>
            <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 28 }}>Ajustez les curseurs selon votre situation</p>

            <Slider label="Rapports produits / mois" icon="document" value={reports} onChange={setReports} min={1} max={60} step={1} unit="" />
            <Slider label="Heures par rapport" icon="clock" value={hoursPerReport} onChange={setHoursPerReport} min={1} max={16} step={1} unit="h" />
            <Slider label="Coût horaire moyen" icon="euro" value={hourlyRate} onChange={setHourlyRate} min={30} max={200} step={5} unit="€" />

            <div style={{ marginTop: 8, padding: "18px 20px", background: "rgba(244,63,94,0.06)", border: "1px solid rgba(244,63,94,0.15)", borderRadius: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ color: T.textMuted, fontSize: 14, fontWeight: 500 }}>Coût actuel / an</span>
                <span style={{ color: T.error, fontSize: 28, fontWeight: 700, fontFamily: T.mono }}>
                  <AnimatedNumber value={totalCostYear} suffix=" €" />
                </span>
              </div>
              <div style={{ color: T.textMuted, fontSize: 12, marginTop: 6, fontFamily: T.mono }}>
                {totalHoursMonth.toLocaleString("fr-FR")}h / mois consacrées au reporting
              </div>
            </div>
          </SlabCard>

          <SlabCard style={{ flex: "1 1 400px", position: "relative", overflow: "hidden", minHeight: 480 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
              <IconChip name="sparkle" size={36} iconSize={18} tone="gold" />
              <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Votre potentiel avec VYZOR</h2>
            </div>
            <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>Estimation basée sur nos clients existants</p>

            <div style={{ filter: emailSubmitted ? "none" : "blur(8px)", transition: "filter 0.5s", pointerEvents: emailSubmitted ? "auto" : "none" }}>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 24 }}>
                <ResultCard iconName="euro" label="Économie / an" color={T.success}
                  value={<AnimatedNumber value={showResults ? savedCostYear : 0} suffix=" €" />} />
                <ResultCard iconName="calendar" label="Jours récupérés" color={T.brandGold} sub="par an"
                  value={<AnimatedNumber value={showResults ? daysRecovered : 0} suffix="j" />} />
              </div>

              <GaugeBar label="Réduction du temps de reporting" pct={showResults ? 70 : 0} color={T.success} />
              <GaugeBar label="Fiabilité des données" pct={showResults ? 95 : 0} color={T.brandGold} />
              <GaugeBar label="Réactivité décisionnelle" pct={showResults ? 85 : 0} color={T.warning} />

              <div style={{ marginTop: 22, padding: "18px 20px", background: "rgba(16,185,129,0.06)", border: "1px solid rgba(16,185,129,0.15)", borderRadius: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ color: T.textMuted, fontSize: 13, fontWeight: 500 }}>Coût par rapport</span>
                  <div>
                    <span style={{ color: T.error, textDecoration: "line-through", fontSize: 14, marginRight: 12, fontFamily: T.mono }}>{costPerReport.toLocaleString("fr-FR")} €</span>
                    <span style={{ color: T.success, fontSize: 22, fontWeight: 700, fontFamily: T.mono }}>{costPerReportVyzor.toLocaleString("fr-FR")} €</span>
                  </div>
                </div>
                <div style={{ color: T.textMuted, fontSize: 11 }}>ROI estimé dès le premier mois d'utilisation</div>
              </div>
            </div>

            {!emailSubmitted && <EmailGate onSubmit={handleEmailSubmit} icon="lock" title="Débloquez votre analyse" desc="Recevez votre rapport personnalisé avec des recommandations concrètes pour réduire vos coûts de reporting." />}
          </SlabCard>
        </div>

        <CtaFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
