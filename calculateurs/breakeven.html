<script type="text/babel">

function BreakevenSVG({ fixedCosts, variableCostUnit, priceUnit, breakEvenQty, currentQty }) {
  const W = 720, H = 360, PAD = { top: 30, right: 30, bottom: 50, left: 70 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;
  const maxQty = Math.max(breakEvenQty * 1.6, currentQty * 1.3, 10);
  const maxVal = Math.max(fixedCosts + variableCostUnit * maxQty, priceUnit * maxQty, fixedCosts * 2);
  const x = (q) => PAD.left + (q / maxQty) * plotW;
  const y = (v) => PAD.top + plotH - (v / maxVal) * plotH;
  const steps = 80;
  const revenuePath = Array.from({ length: steps + 1 }, (_, i) => {
    const q = (i / steps) * maxQty;
    return `${i === 0 ? "M" : "L"}${x(q)},${y(priceUnit * q)}`;
  }).join(" ");
  const costPath = Array.from({ length: steps + 1 }, (_, i) => {
    const q = (i / steps) * maxQty;
    return `${i === 0 ? "M" : "L"}${x(q)},${y(fixedCosts + variableCostUnit * q)}`;
  }).join(" ");
  const fixedPath = `M${x(0)},${y(fixedCosts)} L${x(maxQty)},${y(fixedCosts)}`;
  const fmt = (v) => v >= 1000000 ? `${(v / 1000000).toFixed(1)}M` : v >= 1000 ? `${(v / 1000).toFixed(0)}k` : v.toFixed(0);

  // Profit zone
  const profitZone = breakEvenQty > 0 && breakEvenQty < maxQty ? (() => {
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const q = breakEvenQty + (i / 30) * (maxQty - breakEvenQty);
      pts.push(`${x(q)},${y(priceUnit * q)}`);
    }
    for (let i = 30; i >= 0; i--) {
      const q = breakEvenQty + (i / 30) * (maxQty - breakEvenQty);
      pts.push(`${x(q)},${y(fixedCosts + variableCostUnit * q)}`);
    }
    return `M${pts.join(" L")} Z`;
  })() : null;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      {Array.from({ length: 5 }, (_, i) => {
        const val = (i / 4) * maxVal;
        return (
          <g key={i}>
            <line x1={PAD.left} y1={y(val)} x2={W - PAD.right} y2={y(val)} stroke={T.borderSubtle} strokeWidth="1" />
            <text x={PAD.left - 8} y={y(val) + 4} fill={T.textMuted} fontSize="11" fontFamily={T.mono} textAnchor="end">{fmt(val)} €</text>
          </g>
        );
      })}
      {Array.from({ length: 5 }, (_, i) => {
        const q = (i / 4) * maxQty;
        return <text key={i} x={x(q)} y={H - 18} fill={T.textMuted} fontSize="11" fontFamily={T.mono} textAnchor="middle">{Math.round(q)}</text>;
      })}
      <text x={W / 2} y={H - 4} fill={T.textMuted} fontSize="11" textAnchor="middle">Quantité vendue</text>

      {profitZone && <path d={profitZone} fill="rgba(16,185,129,0.10)" />}

      <path d={fixedPath} stroke={T.warning} strokeWidth="1.5" strokeDasharray="6 4" fill="none" opacity="0.5" />
      <path d={costPath} stroke={T.error} strokeWidth="2.5" fill="none" />
      <path d={revenuePath} stroke={T.success} strokeWidth="2.5" fill="none" />

      {breakEvenQty > 0 && breakEvenQty <= maxQty && (
        <g>
          <line x1={x(breakEvenQty)} y1={PAD.top} x2={x(breakEvenQty)} y2={PAD.top + plotH} stroke={T.brandGold} strokeWidth="1.5" strokeDasharray="4 3" />
          <circle cx={x(breakEvenQty)} cy={y(priceUnit * breakEvenQty)} r="16" fill={T.brandGold} opacity="0.1" />
          <circle cx={x(breakEvenQty)} cy={y(priceUnit * breakEvenQty)} r="7" fill={T.bgBase} stroke={T.brandGold} strokeWidth="2.5" />
          <rect x={x(breakEvenQty) - 50} y={y(priceUnit * breakEvenQty) - 36} width="100" height="22" rx="5" fill={T.brandGold} />
          <text x={x(breakEvenQty)} y={y(priceUnit * breakEvenQty) - 21} fill="#000" fontSize="11" fontFamily={T.mono} fontWeight="700" textAnchor="middle">BEP : {Math.round(breakEvenQty)} u.</text>
        </g>
      )}
      {currentQty > 0 && currentQty <= maxQty && (
        <g>
          <line x1={x(currentQty)} y1={PAD.top} x2={x(currentQty)} y2={PAD.top + plotH} stroke={T.textMuted} strokeWidth="1" strokeDasharray="3 3" opacity="0.5" />
          <circle cx={x(currentQty)} cy={y(priceUnit * currentQty)} r="5" fill={currentQty >= breakEvenQty ? T.success : T.error} />
        </g>
      )}
    </svg>
  );
}

function App() {
  const [fixedCosts, setFixedCosts] = React.useState(25000);
  const [variableCost, setVariableCost] = React.useState(35);
  const [sellingPrice, setSellingPrice] = React.useState(95);
  const [currentQty, setCurrentQty] = React.useState(500);
  const [emailSubmitted, setEmailSubmitted] = React.useState(false);
  const [showResults, setShowResults] = React.useState(false);

  const marginUnit = sellingPrice - variableCost;
  const breakEvenQty = marginUnit > 0 ? Math.ceil(fixedCosts / marginUnit) : Infinity;
  const breakEvenCA = breakEvenQty !== Infinity ? breakEvenQty * sellingPrice : 0;
  const isAboveBE = currentQty >= breakEvenQty && breakEvenQty !== Infinity;
  const profitOrLoss = (currentQty * sellingPrice) - fixedCosts - (currentQty * variableCost);
  const safetyMarginPct = breakEvenQty !== Infinity && currentQty > 0
    ? (((currentQty - breakEvenQty) / currentQty) * 100).toFixed(1) : 0;
  const qtyToGo = breakEvenQty !== Infinity ? Math.max(0, breakEvenQty - currentQty) : Infinity;

  return (
    <div style={{ minHeight: "100vh", background: T.bgBase, color: T.textPrimary }}>
      <PageBg />
      <VyzorTopNav current="hub" />

      <div style={{ position: "relative", zIndex: 1, maxWidth: 960, margin: "0 auto", padding: "120px 20px 48px" }}>
        <a href="../calculateurs.html" style={{
          display: "inline-flex", alignItems: "center", gap: 6, color: T.textMuted,
          fontSize: 12, textDecoration: "none", fontFamily: T.mono, letterSpacing: "0.1em",
          textTransform: "uppercase", marginBottom: 24,
        }}>← Tous les calculateurs</a>

        <div style={{ textAlign: "center", marginBottom: 56 }}>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 10,
            fontFamily: T.mono, fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase",
            color: T.textMuted, marginBottom: 24,
          }}>
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
            Calcul instantané
            <span style={{ width: 22, height: 1, background: "rgba(197,160,89,0.5)" }} />
          </div>
          <h1 style={{ fontSize: "clamp(32px, 5vw, 52px)", fontWeight: 700, lineHeight: 1.1, marginBottom: 20, letterSpacing: "-0.02em" }}>
            Trouvez votre<span style={{ color: T.brandGold }}> seuil de rentabilité</span><br />en 30 secondes
          </h1>
          <p style={{ color: T.textSecondary, fontSize: 18, maxWidth: 620, margin: "0 auto", lineHeight: 1.7 }}>
            À combien de ventes votre activité devient rentable ? Visualisez le croisement entre votre <span style={{ color: T.textPrimary, fontWeight: 600 }}>chiffre d'affaires</span> et vos <span style={{ color: T.textPrimary, fontWeight: 600 }}>coûts totaux</span>.
          </p>
        </div>

        <SlabCard style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
            <IconChip name="settings" size={36} iconSize={18} tone="default" />
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Vos données</h2>
          </div>
          <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>Ajustez vos paramètres — le graphique se met à jour en temps réel</p>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "0 24px" }}>
            <NumberField label="Coûts fixes mensuels" icon="building" value={fixedCosts} onChange={setFixedCosts} unit="€ / mois" step={500} />
            <NumberField label="Coût variable unitaire" icon="box" value={variableCost} onChange={setVariableCost} unit="€ / unité" step={1} />
            <NumberField label="Prix de vente unitaire" icon="tag" value={sellingPrice} onChange={setSellingPrice} unit="€ / unité" step={1} />
            <NumberField label="Vos ventes actuelles / mois" icon="trend" value={currentQty} onChange={setCurrentQty} unit="unités" step={10} />
          </div>

          <div style={{
            marginTop: 8, padding: "16px 24px", borderRadius: 12,
            display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 16,
            background: marginUnit > 0 ? `${T.brandGold}08` : "rgba(244,63,94,0.06)",
            border: `1px solid ${marginUnit > 0 ? `${T.brandGold}20` : "rgba(244,63,94,0.15)"}`,
          }}>
            {marginUnit > 0 ? (
              <React.Fragment>
                <div>
                  <span style={{ color: T.textMuted, fontSize: 13, fontWeight: 500 }}>Point mort : </span>
                  <span style={{ color: T.brandGold, fontSize: 22, fontWeight: 700, fontFamily: T.mono }}>
                    <AnimatedNumber value={breakEvenQty !== Infinity ? breakEvenQty : 0} suffix=" ventes" />
                  </span>
                  <span style={{ color: T.textMuted, fontSize: 12, marginLeft: 12, fontFamily: T.mono }}>
                    soit {breakEvenCA.toLocaleString("fr-FR")} € de CA
                  </span>
                </div>
                <div style={{
                  padding: "6px 14px", borderRadius: 8,
                  background: isAboveBE ? "rgba(16,185,129,0.1)" : "rgba(244,63,94,0.1)",
                  color: isAboveBE ? T.success : T.error,
                  fontSize: 13, fontWeight: 700, fontFamily: T.mono,
                }}>
                  {isAboveBE ? `+${(currentQty - breakEvenQty).toLocaleString("fr-FR")} ventes au-dessus` : `−${qtyToGo.toLocaleString("fr-FR")} ventes manquantes`}
                </div>
              </React.Fragment>
            ) : (
              <div style={{ color: T.error, fontSize: 14, fontWeight: 600 }}>
                Prix de vente inférieur au coût variable — rentabilité impossible
              </div>
            )}
          </div>
        </SlabCard>

        <SlabCard style={{ marginBottom: 20 }}>
          <BreakevenSVG fixedCosts={fixedCosts} variableCostUnit={variableCost} priceUnit={sellingPrice}
            breakEvenQty={breakEvenQty !== Infinity ? breakEvenQty : 0} currentQty={currentQty} />
        </SlabCard>

        <SlabCard style={{ position: "relative", overflow: "hidden", minHeight: 200, marginBottom: 32 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
            <IconChip name="sparkle" size={36} iconSize={18} tone="gold" />
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Analyse détaillée</h2>
          </div>

          <div style={{ filter: emailSubmitted ? "none" : "blur(8px)", transition: "filter 0.5s", pointerEvents: emailSubmitted ? "auto" : "none" }}>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
              <KpiTile icon="target" label="Breakeven" color={T.brandGold} sub={`CA : ${breakEvenCA.toLocaleString("fr-FR")} €`}
                value={breakEvenQty !== Infinity ? <AnimatedNumber value={showResults ? breakEvenQty : 0} suffix=" u." /> : "∞"} />
              <KpiTile icon="trend" label="Résultat / mois"
                color={profitOrLoss >= 0 ? T.success : T.error}
                sub={profitOrLoss >= 0 ? "Profit" : "Perte"}
                value={<AnimatedNumber value={showResults ? Math.abs(profitOrLoss) : 0} suffix=" €" />} />
              <KpiTile icon="scale" label="Marge de sécurité"
                value={showResults ? `${safetyMarginPct}%` : "—"}
                color={Number(safetyMarginPct) >= 20 ? T.success : Number(safetyMarginPct) >= 0 ? T.warning : T.error}
                sub={Number(safetyMarginPct) >= 25 ? "Confortable" : Number(safetyMarginPct) >= 10 ? "Correcte" : Number(safetyMarginPct) >= 0 ? "Fragile" : "Danger"} />
            </div>

            <div style={{ padding: "16px 20px", borderRadius: 12,
              background: isAboveBE ? "rgba(16,185,129,0.06)" : "rgba(244,63,94,0.06)",
              border: `1px solid ${isAboveBE ? "rgba(16,185,129,0.15)" : "rgba(244,63,94,0.15)"}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{
                  width: 8, height: 8, borderRadius: "50%",
                  background: isAboveBE ? T.success : T.error,
                  boxShadow: `0 0 12px ${isAboveBE ? T.success : T.error}`,
                  flexShrink: 0,
                }} />
                <div>
                  <div style={{ color: isAboveBE ? T.success : T.error, fontSize: 14, fontWeight: 700 }}>
                    {isAboveBE ? `Rentable — vous dépassez le breakeven de ${(currentQty - breakEvenQty).toLocaleString("fr-FR")} ventes` : `Pas encore rentable — il manque ${qtyToGo !== Infinity ? qtyToGo.toLocaleString("fr-FR") : "∞"} ventes`}
                  </div>
                  <div style={{ color: T.textMuted, fontSize: 12, marginTop: 2 }}>
                    {isAboveBE ? `Chaque vente supplémentaire génère ${marginUnit.toLocaleString("fr-FR")} € de profit pur.` : `Votre marge unitaire de ${marginUnit.toLocaleString("fr-FR")} € doit absorber ${fixedCosts.toLocaleString("fr-FR")} € de coûts fixes.`}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {!emailSubmitted && <EmailGate onSubmit={() => { setEmailSubmitted(true); setShowResults(true); }} icon="lock" title="Débloquez votre analyse breakeven" desc="Point mort exact, marge de sécurité et recommandations personnalisées." />}
        </SlabCard>

        <CtaFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
