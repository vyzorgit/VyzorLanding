      <h1 style="font-size:32px;margin:0 0 16px;">Mentions légales &amp; CGU</h1>
      <p style="font-size:17px;color:#aab;margin:0 0 24px;">Mentions légales et Conditions Générales d'Utilisation du site et des services VYZOR.</p>

  <script type="text/babel" src="shared.jsx"></script>

  <script type="text/babel">
    // Page « À propos » : faits vérifiables sur Vyzor (identité de marque pour Google et les assistants IA).
    const AboutVyzor = () => (
      <LegalShell>
        <LegalArticle n="01" id="en-bref" title="Vyzor en bref">
          <Bullets items={[
            <span><Strong>Ce que c'est</Strong> : un logiciel de pilotage financier qui transforme les données comptables (connecteur Pennylane, ou import FEC, Excel et PDF) en tableaux de bord, indicateurs, prévisions de trésorerie et alertes.</span>,
            <span><Strong>Pour qui</Strong> : avant tout les dirigeants de PME qui utilisent Pennylane ; aussi les DAF (internes, externalisés ou à temps partagé) et les cabinets d'expertise comptable.</span>,
            <span><Strong>Où nous en sommes</Strong> : accès anticipé (bêta), en France, service en français.</span>,
            <span><Strong>Les données</Strong> : importées en lecture seule, hébergées dans l'Union européenne, jamais utilisées pour entraîner des modèles d'IA.</span>,
            <span><Strong>Contact</Strong> : <Mail />.</span>,
          ]} />
        </LegalArticle>

        <LegalArticle n="02" id="pourquoi" title="Pourquoi Vyzor">
          <P>
            La comptabilité d'une PME contient l'essentiel de ce qu'il faut pour la piloter, mais elle reste difficile
            à lire pour qui n'est pas du métier. Vyzor analyse le passé de l'entreprise, éclaire son présent et projette
            son futur financier, pour que le dirigeant décide avec des chiffres clairs, sans attendre le bilan.
          </P>
        </LegalArticle>

        <LegalArticle n="03" id="construction" title="Construit avec des professionnels du chiffre">
          <P>
            Vyzor est co-construit avec un panel de DAF qui l'utilisent sur leurs propres chiffres : ils testent
            l'outil en conditions réelles, remontent ce qui manque ou ce qui gêne, et les retours qui font consensus
            entrent dans le produit.
          </P>
        </LegalArticle>

        <LegalArticle n="04" id="equipe" title="L'équipe">
          <P>
            Vyzor est fondé par <Strong>Antoine Cayer</Strong> (CEO, diplômé du MSc Data for Finance de Mines Paris–PSL,
            passé par Air Liquide et LVMH) et <Strong>Louis Chevalier</Strong> (co-fondateur en charge de l'acquisition, également
            diplômé du MSc Data for Finance de Mines Paris–PSL, passé par Natixis CIB et Kano), associés.
            L'entreprise est une société par actions simplifiée (SAS) en cours de formation, établie en France.
          </P>
          <P>
            L'idée est née d'un constat simple : les grands groupes ont des équipes entières pour lire leurs chiffres,
            les PME ont un bilan par an. Vyzor veut donner au dirigeant de PME la même lecture, sans l'équipe.
            Pendant la bêta, les premiers utilisateurs parlent directement aux fondateurs :{" "}
            <A href="/?contact=1#beta">réservez votre place</A>.
          </P>
        </LegalArticle>

        <LegalArticle n="05" id="nom" title="Vyzor, avec un Z">
          <P>
            Vyzor s'écrit V-Y-Z-O-R. Il n'a aucun lien avec Vysor, l'application de recopie d'écran pour Android,
            ni avec d'autres produits au nom proche. Le seul site officiel est <A href="/">www.vyzor.fr</A>.
          </P>
        </LegalArticle>

        <LegalArticle n="06" id="plus-loin" title="Pour aller plus loin">
          <Bullets items={[
            <span><A href="/fonctionnalites">Les fonctionnalités</A> : analyse financière, trésorerie, alertes, Conseil, juridique, multi-sociétés.</span>,
            <span><A href="/securite">La sécurité et la confidentialité</A> des données.</span>,
            <span><A href="/calculateurs">Les calculateurs gratuits</A> : BFR, seuil de rentabilité, valorisation, simulateur fiscal.</span>,
            <span><A href="/faq">Les questions fréquentes</A>.</span>,
          ]} />
        </LegalArticle>
      </LegalShell>
    );

    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      // Ancre (#cookies…) : le contenu est rendu après Babel, le navigateur ne peut
      // donc pas y défiler seul au chargement.
      React.useEffect(() => {
        const hash = window.location.hash;
        if (!hash) return;
        const target = document.getElementById(hash.slice(1));
        if (target) { target.classList.add("in"); target.scrollIntoView(); }
      }, []);

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />

          <div style={{
            background: "#070a14",
            backgroundImage: "none",
            color: text,
            position: "relative",
            overflowX: "clip",
            paddingBottom: 56,
          }}>
            <main id="contenu" tabIndex={-1} style={{ outline: "none" }}>
            <header className="pg-hero vz-reveal in">
              <h1 className="pg-title">À propos de Vyzor</h1>
              <p style={{ margin: 0, maxWidth: 640, fontSize: 17, lineHeight: 1.6, color: "rgba(255,255,255,0.65)", textWrap: "pretty" }}>Le logiciel français de pilotage financier des dirigeants de PME, des DAF et des experts-comptables.</p>
            </header>

            <div style={{ marginTop: 8 }}>
              <AboutVyzor />
            </div>
            </main>

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
