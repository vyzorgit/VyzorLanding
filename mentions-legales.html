  <style>
    :root {
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --font-display: var(--font-sans);

    }
    html, body, #root { margin: 0; padding: 0; }
    html, body { background: #070a14; }
    html { scroll-behavior: smooth; scroll-padding-top: 110px; }

    .vz-reveal {
      opacity: 0; transform: translateY(28px);
      transition: opacity 800ms cubic-bezier(0.22, 1, 0.36, 1), transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .vz-reveal.in { opacity: 1; transform: none; }
    .vz-reveal.in + .vz-reveal.in { transition-delay: 60ms; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .vz-reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11", "calt";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: rgba(255,255,255,0.92);
      overflow-x: clip;
    }
    button, input, textarea, select { font-family: inherit; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); letter-spacing: -0.02em; }
    code, kbd, samp, pre { font-family: var(--font-mono); }
    * { box-sizing: border-box; }
    a { color: inherit; }
    ::selection { background: rgba(240,201,73,0.35); color: #fff; }

    .pg-hero {

      color: #f0c949; text-transform: uppercase;

    .pg-title {

  <div id="root"></div>
  <noscript>
    <div style="max-width:760px;margin:0 auto;padding:64px 24px;font-family:system-ui,-apple-system,sans-serif;color:#e7e9f0;line-height:1.6;">
      <h1 style="font-size:32px;margin:0 0 16px;">Mentions légales &amp; CGU</h1>
      <p style="font-size:17px;color:#aab;margin:0 0 24px;">Mentions légales et Conditions Générales d'Utilisation du site et des services VYZOR.</p>
      <nav style="font-size:15px;font-weight:600;"><a href="index.html" style="color:#f0c949;margin-right:18px;">Accueil</a></nav>
    </div>
  </noscript>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="glow-border.jsx"></script>
  <script type="text/babel" src="variant-a.jsx"></script>
  <script type="text/babel" src="legal-glass.jsx"></script>
  <script type="text/babel" src="footer-glass.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />

          <div style={{
            background: "#070a14",
            backgroundImage:
              "radial-gradient(60% 40% at 15% 0%, rgba(45,212,191,0.12), transparent 60%), radial-gradient(50% 40% at 90% 8%, rgba(240,201,73,0.10), transparent 60%)",
            color: text,
            position: "relative",
            overflowX: "clip",
            paddingBottom: 56,
          }}>
            <header className="pg-hero vz-reveal in">
              <div className="pg-eyebrow">Informations légales</div>
              <h1 className="pg-title">Mentions légales &amp; CGU</h1>
              <p className="pg-lede">Dernière mise à jour : 03/05/2026</p>
            </header>

            <div style={{ marginTop: 8 }}>
              <MentionsLegales />
            </div>

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
