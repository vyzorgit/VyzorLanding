  <style>
    :root {
      /* Système typographique unifié — 2 polices max */
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      /* Alias sémantiques (titres / corps partagent Inter, graisses différentes) */
      --font-display: var(--font-sans);
      --font-text: var(--font-sans);
    }
    html, body, #root { margin: 0; padding: 0; }
    html, body { background: #0a1026; }

    /* —— Scroll fluide + offset pour la nav flottante —— */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    /* —— Reveal subtil à l'entrée en viewport ——
       transform + opacity uniquement : le blur sur des sections entières
       coûtait très cher au compositing et rendait le scroll saccadé. */
    .vz-reveal {
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 700ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .vz-reveal.in {
      opacity: 1;
      transform: none;
      will-change: auto;
    }
    /* —— Économie GPU : boucles décoratives (bordures conic, CTA doré)
       mises en pause quand l'élément est hors viewport —— */
    .vz-anim-off .border-element,
    .vz-anim-off::before,
    .vz-anim-off::after {
      animation-play-state: paused !important;
    }

    /* —— Respect de l'accessibilité —— */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .vz-reveal { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11", "calt";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: rgba(255,255,255,0.92);
      overflow-x: hidden;
    }
    /* Tout hérite du body — pas de re-déclaration sauvage */
    button, input, textarea, select { font-family: inherit; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); letter-spacing: -0.02em; }
    code, kbd, samp, pre { font-family: var(--font-mono); }
    * { box-sizing: border-box; }
    a { color: inherit; }
    ::selection { background: rgba(240,201,73,0.35); color: #fff; }
  </style>

  <noscript>
    <div style="max-width:760px;margin:0 auto;padding:64px 24px;font-family:system-ui,-apple-system,sans-serif;color:#e7e9f0;line-height:1.6;">
      <h1 style="font-size:32px;margin:0 0 16px;">Vous perdez de l'argent quelque part. Vyzor vous montre où.</h1>
      <p style="font-size:17px;color:#aab;margin:0 0 24px;">Vyzor, le logiciel de pilotage financier pour PME, lit votre comptabilité Pennylane et vous dit où part votre argent, ce qu'il vous restera dans 12 mois et quoi faire en premier.</p>

  <script type="text/babel">
    const GlowExploreCard = ({ item, gold, text }) => {
      const [hover, setHover] = React.useState(false);
      return (
        <a href={item.href} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{
          display: "flex", alignItems: "center", gap: 16, minHeight: 104, padding: "20px 24px",
          borderRadius: 14, textDecoration: "none", color: text,
          backgroundColor: hover ? "rgba(255,255,255,0.035)" : "rgba(255,255,255,0.02)",
          border: `1px solid ${hover ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.08)"}`,
          transition: "background-color 160ms ease, border-color 160ms ease",
        }}>
          <span style={{ width: 40, height: 40, borderRadius: 10, flexShrink: 0, display: "grid", placeItems: "center", border: "1px solid rgba(255,255,255,0.10)", color: gold }}>{item.icon}</span>
          <span style={{ flex: 1, minWidth: 0, display: "block" }}>
            <span style={{ display: "block", fontSize: 13, fontWeight: 500, color: gold, marginBottom: 4 }}>{item.kicker}</span>
            <span style={{ display: "block", fontSize: 16, fontWeight: 600, lineHeight: 1.3, color: "#fff" }}>{item.title}</span>
          </span>
          <span aria-hidden="true" style={{ flexShrink: 0, color: hover ? "#fff" : "rgba(255,255,255,0.5)", fontSize: 18, transition: "color 160ms ease" }}>→</span>
        </a>
      );
    };

    // —— Duo de cartes premium pour inciter à visiter Fonctionnalités & Sécurité
    const ExploreMore = ({ gold, text }) => {
      const items = [
        {
          href: "/fonctionnalites",
          kicker: "Fonctionnalités",
          title: "Voir tout ce que Vyzor sait faire",
          icon: (
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.2"/>
              <rect x="14" y="3" width="7" height="7" rx="1.2"/>
              <rect x="3" y="14" width="7" height="7" rx="1.2"/>
              <rect x="14" y="14" width="7" height="7" rx="1.2"/>
            </svg>
          ),
        },
        {
          href: "/securite",
          kicker: "Sécurité",
          title: "Données hébergées dans l'UE, chiffrement, conformité",
          icon: (
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          ),
        },
      ];
      return (
        <div className="vz-explore-more" style={{
          display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18,
          marginTop: -56, marginBottom: 80,
        }}>
          {items.map((it) => (
            <GlowExploreCard key={it.href} item={it} gold={gold} text={text} />
          ))}
        </div>
      );
    };

    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      // Reveal-on-scroll : on observe les éléments .vz-reveal et on ajoute .in
      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });

        // Boucles décoratives : pause hors viewport (bordures conic, CTA doré)
        const gate = new IntersectionObserver((entries) => {
          entries.forEach((e) => e.target.classList.toggle("vz-anim-off", !e.isIntersecting));
        }, { rootMargin: "140px" });
        const observeAll = () => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
          document.querySelectorAll(".vz-verbatim-card, .vz-beta-cta").forEach(el => gate.observe(el));
        };
        // On laisse React monter le DOM avant d'observer (+ re-scan pour les montages tardifs)
        const id = requestAnimationFrame(observeAll);
        const late = setTimeout(observeAll, 1400);
        return () => { cancelAnimationFrame(id); clearTimeout(late); io.disconnect(); gate.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />
          <StickyBetaCta />
          <main id="contenu" tabIndex={-1} style={{ outline: "none" }}>
            <CinematicHero />
            {/* Reste de la page : on réutilise les sections de la variante A après le hero cinématique */}
            <div style={{ position: "relative", zIndex: 1 }}>
              <RestOfPage />
            </div>
          </main>
          {/* Footer plein écran — hors <main>, sort du container 1180px */}
          <div style={{ background: "#0a1026", position: "relative", zIndex: 1, padding: "96px 0 56px" }}>
            <div className="vz-reveal">
              <VyzorFooterGlass fullWidth />
            </div>
          </div>
        </React.Fragment>
      );
    };

    // Wrapper that reuses VariantA sections AFTER the hero — we render VariantA but
    // hide its built-in hero by adjusting layout (cinematic hero replaces it).
    const RestOfPage = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";
      return (
        <div style={{
          background: "#0a1026",
          // Vagues bleu nuit : des zones plus claires alternent avec le fond, pour aérer la page
          backgroundImage: "linear-gradient(180deg, #0a1026 0%, #0d1430 9%, #0a1026 20%, #0d1430 34%, #0a1026 46%, #0e1634 60%, #0a1026 72%, #0d1430 86%, #0a1026 100%)",
          color: text,
          fontFamily: '"Inter", system-ui, sans-serif',
          padding: "32px 0 0",
          position: "relative",
        }}>
          <div className="vz-page-pad" style={{
            maxWidth: 1180,
            margin: "0 auto",
            padding: "0 clamp(24px, 6vw, 96px)",
          }}>
            {/* Narratif (refonte 27/10/2026) : la preuve visuelle d'abord (démo), puis la douleur,
                la facilité (3 étapes), la crédibilité (DAF), enfin l'offre bêta. */}
            <AgenticTwinSection id="produit" gold={gold} text={text} muted={muted} subtle={subtle} />
            <div className="vz-reveal"><BesoinClientSection id="constat" gold={gold} text={text} muted={muted} subtle={subtle} audience="dirigeant" showBridge={false} /></div>
            <div className="vz-reveal"><OutcomesSection id="resultats" gold={gold} muted={muted} /></div>
            <div className="vz-reveal"><HowItWorksSection id="comment" gold={gold} text={text} muted={muted} subtle={subtle} /></div>
            <div className="vz-reveal"><DAFCoConception /></div>
            <div className="vz-reveal"><BetaFormGlass /></div>
            <div className="vz-reveal" style={{ marginTop: 120 }}><ObjectionsSection id="questions" gold={gold} muted={muted} /></div>
            <div className="vz-reveal"><FinalCtaSection gold={gold} muted={muted} /></div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
