  <script type="text/babel">
    const App = () => {
      const gold = "#f0c949";
      const text = "rgba(255,255,255,0.92)";
      const muted = "rgba(255,255,255,0.55)";
      const subtle = "rgba(255,255,255,0.08)";

      React.useEffect(() => {
        if (typeof IntersectionObserver === "undefined") {
          document.querySelectorAll(".vz-reveal").forEach(el => el.classList.add("in"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        const id = requestAnimationFrame(() => {
          document.querySelectorAll(".vz-reveal").forEach(el => io.observe(el));
        });
        return () => { cancelAnimationFrame(id); io.disconnect(); };
      }, []);

      return (
        <React.Fragment>
          <VyzorNav gold={gold} text={text} muted={muted} subtle={subtle} />

          <div style={{
            background: "#070a14",
            backgroundImage:
              "radial-gradient(60% 40% at 15% 0%, rgba(45,212,191,0.14), transparent 60%), radial-gradient(50% 40% at 90% 10%, rgba(240,201,73,0.12), transparent 60%), radial-gradient(40% 30% at 50% 100%, rgba(99,102,241,0.10), transparent 60%)",
            color: text,
            position: "relative",
            overflowX: "clip",
            paddingBottom: 56,
          }}>
            <header className="pg-hero vz-reveal in">
              <h1 className="pg-title">Une sécurité de <em>niveau bancaire</em>.</h1>
              <p className="pg-lede">
                Vos données financières sont chiffrées, isolées et hébergées chez les mêmes
                partenaires d'infrastructure que les banques et fintechs régulées européennes.
              </p>
            </header>

            <div className="vz-page-pad" style={{
              maxWidth: 1180,
              margin: "0 auto",
              padding: "0 clamp(24px, 6vw, 96px)",
            }}>
              <div><SecuritySectionStacked /></div>
              <div className="vz-reveal"><BetaFormGlass /></div>
            </div>

            <div className="vz-reveal" style={{ marginTop: 96 }}>
              <VyzorFooterGlass fullWidth />
            </div>
          </div>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
